<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Python & OOP Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF6;
    --bg-elevated: #FFFFFF;
    --ink: #1C1F26;
    --ink-soft: #5B6270;
    --ink-faint: #8B92A0;
    --border: #E4E1D8;
    --accent: #2E7D5B;
    --accent-soft: #E4F2EB;
    --accent-ink: #1E5E43;
    --amber: #B8722E;
    --amber-soft: #F5E9D9;
    --wrong: #B3432E;
    --wrong-soft: #FBE9E5;
    --rail-bg: #F3F1E9;
    --shadow: 0 1px 2px rgba(28,31,38,0.04), 0 8px 24px rgba(28,31,38,0.06);
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #16181D;
      --bg-elevated: #1D2027;
      --ink: #EDEBE3;
      --ink-soft: #A6ACB8;
      --ink-faint: #6E7481;
      --border: #2C2F38;
      --accent: #4FAE84;
      --accent-soft: #1B3129;
      --accent-ink: #7FCBA9;
      --amber: #D99A54;
      --amber-soft: #362A18;
      --wrong: #E17158;
      --wrong-soft: #35201C;
      --rail-bg: #1A1C22;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181D;
    --bg-elevated: #1D2027;
    --ink: #EDEBE3;
    --ink-soft: #A6ACB8;
    --ink-faint: #6E7481;
    --border: #2C2F38;
    --accent: #4FAE84;
    --accent-soft: #1B3129;
    --accent-ink: #7FCBA9;
    --amber: #D99A54;
    --amber-soft: #362A18;
    --wrong: #E17158;
    --wrong-soft: #35201C;
    --rail-bg: #1A1C22;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .rail.open { display: block; position: fixed; inset: 0; z-index: 40; overflow-y: auto; }
  }

  /* ---- Rail ---- */
  .rail {
    background: var(--rail-bg);
    border-right: 1px solid var(--border);
    padding: 22px 16px 40px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .rail-head { margin-bottom: 18px; position: relative; }
  .rail-close {
    display: none;
  }
  @media (max-width: 860px) {
    .rail-close {
      display: flex;
      position: absolute;
      top: -4px; right: -4px;
      align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--ink-soft);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
  }
  .rail-title {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin: 0 0 4px;
  }
  .rail-score {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }
  .rail-score span { color: var(--ink-faint); font-weight: 400; font-size: 15px; }

  .rail-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
  .chip {
    font-family: var(--sans);
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color .15s, color .15s;
    touch-action: manipulation;
    min-height: 32px;
  }
  .chip:hover { border-color: var(--ink-faint); }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .qgrid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .qdot {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink-soft);
    cursor: pointer;
    transition: transform .1s, border-color .15s;
    touch-action: manipulation;
    min-height: 40px;
  }
  .qdot:hover { border-color: var(--ink-faint); }
  .qdot.current { border-color: var(--ink); border-width: 2px; font-weight: 600; color: var(--ink); }
  .qdot.correct { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
  .qdot.incorrect { background: var(--wrong-soft); color: var(--wrong); border-color: transparent; }

  /* ---- Main ---- */
  .main { padding: 32px 40px 80px; max-width: 760px; }
  @media (max-width: 600px) { .main { padding: 20px 18px 60px; } }


  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }
  @media (max-width: 860px) {
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 12px 0 12px;
      margin: -20px -18px 12px;
      padding-left: 18px;
      padding-right: 18px;
      border-bottom: 1px solid var(--border);
    }
  }
  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .menu-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 12px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--ink-soft); padding: 8px 12px; border-radius: 8px; cursor: pointer;
      min-height: 36px;
      touch-action: manipulation;
    }
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }
  .progress-label { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 28px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 600px) { .card { padding: 22px 18px; } }

  .cat-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    background: var(--amber-soft);
    color: var(--amber);
    margin-bottom: 14px;
  }
  .qnum { color: var(--ink-faint); font-weight: 400; }

  .question-text {
    font-size: 17px;
    line-height: 1.55;
    margin: 0 0 14px;
  }
  .question-text code, .qcode {
    font-family: var(--mono);
    background: var(--rail-bg);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.92em;
  }
  pre.qcode-block {
    font-family: var(--mono);
    background: var(--rail-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 0 0 22px;
    font-size: 13px;
    line-height: 1.55;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: pre;
    color: var(--ink);
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    padding: 14px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color .12s, background .12s;
    touch-action: manipulation;
    min-height: 48px;
  }
  .opt:hover:not(.locked) { border-color: var(--ink-faint); }
  .opt:active:not(.locked) { border-color: var(--ink); }
  .opt.selected { border-color: var(--ink); border-width: 1.5px; }
  .opt.focused {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft), inset 0 0 0 1px var(--accent);
  }
  .kbd-hint {
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin: 14px 0 0;
  }
  @media (max-width: 600px) { .kbd-hint { display: none; } }
  .opt-label {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    background: var(--rail-bg);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
  }
  .opt.correct { background: var(--accent-soft); border-color: var(--accent); }
  .opt.correct .opt-label { background: var(--accent); color: white; }
  .opt.incorrect { background: var(--wrong-soft); border-color: var(--wrong); }
  .opt.incorrect .opt-label { background: var(--wrong); color: white; }
  .opt.locked { cursor: default; }
  .opt.dim { opacity: 0.5; }

  .explain {
    margin-top: 18px;
    padding: 16px 16px;
    border-radius: 10px;
    background: var(--rail-bg);
    border-left: 3px solid var(--accent);
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    display: none;
  }
  .explain.show { display: block; }
  .explain b { color: var(--ink); font-weight: 600; }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .btn {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, border-color .12s;
    touch-action: manipulation;
    min-height: 44px;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn.primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .btn.primary:hover { opacity: .9; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-family: var(--mono);
    font-size: 12.5px;
    cursor: pointer;
    padding: 10px 8px;
    touch-action: manipulation;
    min-height: 40px;
  }
  .btn-ghost:hover { color: var(--ink); }

  /* summary */
  .summary { text-align: center; padding: 10px 0 20px; }
  .summary .big { font-size: 52px; font-weight: 700; font-family: var(--mono); margin: 6px 0; }
  .summary .big span { color: var(--ink-faint); font-size: 26px; }
  .summary p { color: var(--ink-soft); font-size: 14px; max-width: 420px; margin: 8px auto 24px; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 22px 0;
    text-align: left;
  }
  .summary-cat {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--rail-bg);
  }
  .summary-cat .label { font-size: 12px; color: var(--ink-faint); font-family: var(--mono); margin-bottom: 4px; }
  .summary-cat .val { font-size: 18px; font-weight: 600; }

  footer.hint {
    text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 14px; font-family: var(--mono);
  }

  .bottom-bar {
    display: flex;
    justify-content: center;
    margin-top: 22px;
  }
  .bottom-bar .btn-ghost {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 16px;
    background: var(--bg-elevated);
  }
  .bottom-bar .btn-ghost:hover { border-color: var(--wrong); color: var(--wrong); }
  .bottom-bar .btn-ghost.confirming {
    border-color: var(--wrong);
    color: var(--wrong);
    background: var(--wrong-soft);
  }
</style>
</head>
<body>
<div class="app">

  <aside class="rail" id="rail">
    <div class="rail-head">
      <p class="rail-title">python &amp; oop drills</p>
      <button class="rail-close" id="railCloseBtn" aria-label="Close question list">&times;</button>
      <p class="rail-score" id="railScore">0<span> / 220 answered</span></p>
    </div>
    <div class="rail-filters" id="railFilters"></div>
    <div class="qgrid" id="qgrid"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">≡ questions</button>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">1 / 220</div>
    </div>

    <div class="card" id="quizCard"></div>

    <div class="bottom-bar">
      <button class="btn-ghost" id="resetAllBtn" onclick="resetAll()">↺ reset all progress</button>
    </div>

    <footer class="hint">select an option, then check your answer — or browse the list on the left</footer>
  </main>

</div>

<script>
const QUESTIONS = [{"num": 1, "category": "Basics of OOPs", "question": "What does this code print? class A: def __init__(self): self.__x = 5 a = A() print(hasattr(a, '__x'))", "options": [{"label": "A", "text": "True"}, {"label": "B", "text": "False"}, {"label": "C", "text": "5"}, {"label": "D", "text": "Raises AttributeError"}], "correct": "B", "explanation": "Inside the class, `self.__x` is name-mangled to `self._A__x`, so there is no attribute literally named `__x`; `hasattr(a, '__x')` returns False."}, {"num": 2, "category": "Python fundamentals", "question": "What is the output? a = [1, 2] b = [1, 2] print(a == b, a is b)", "options": [{"label": "A", "text": "True True"}, {"label": "B", "text": "False False"}, {"label": "C", "text": "False True"}, {"label": "D", "text": "True False"}], "correct": "D", "explanation": "== compares contents (equal) while is compares identity; the two lists are distinct objects, so a is b is False."}, {"num": 3, "category": "Basics of OOPs", "question": "Operator overloading allows a programmer to:", "options": [{"label": "A", "text": "Redefine an inherited method inside a subclass"}, {"label": "B", "text": "Declare several constructors with different parameters"}, {"label": "C", "text": "Hide an object's attributes from external code"}, {"label": "D", "text": "Define custom behavior for built-in operators (like +) when they are applied to user-defined types"}], "correct": "D", "explanation": "Operator overloading lets built-in operators such as +, ==, or [] work meaningfully on custom classes by defining special methods (e.g., `__add__`)."}, {"num": 4, "category": "Basics of OOPs", "question": "The 'diamond problem' in multiple inheritance refers to:", "options": [{"label": "A", "text": "Two separate classes both inheriting from one shared subclass"}, {"label": "B", "text": "Ambiguity that arises when a class inherits the same method from two parents that share a common ancestor"}, {"label": "C", "text": "A class that simply has too many methods to maintain"}, {"label": "D", "text": "Circular import dependencies between two modules"}], "correct": "B", "explanation": "When a class inherits from two classes that both derive from a common base, it becomes ambiguous which inherited version of a member should be used."}, {"num": 5, "category": "Python fundamentals", "question": "What is the output? print([1, 2, 3] * 2)", "options": [{"label": "A", "text": "[1, 2, 3, 1, 2, 3]"}, {"label": "B", "text": "[2, 4, 6]"}, {"label": "C", "text": "[[1, 2, 3], [1, 2, 3]]"}, {"label": "D", "text": "Error"}], "correct": "A", "explanation": "The * operator on a list repeats (concatenates) its elements, producing [1, 2, 3, 1, 2, 3]."}, {"num": 6, "category": "Aptitude", "question": "Statements: All pens are books. All books are red. Which conclusion definitely follows?", "options": [{"label": "A", "text": "All red things are pens"}, {"label": "B", "text": "All pens are red"}, {"label": "C", "text": "No pen is red"}, {"label": "D", "text": "Some pens are not red"}], "correct": "B", "explanation": "Since every pen is a book and every book is red, it follows with certainty that all pens are red."}, {"num": 7, "category": "Python fundamentals", "question": "What is the output? for i in range(3): if i == 1: break else: print(\"done\") print(\"end\")", "options": [{"label": "A", "text": "done then end"}, {"label": "B", "text": "done"}, {"label": "C", "text": "end"}, {"label": "D", "text": "(no output)"}], "correct": "C", "explanation": "The break at i == 1 skips the loop's else clause, so 'done' is not printed; only the final 'end' is."}, {"num": 8, "category": "Aptitude", "question": "A bag contains 4 red and 6 blue balls. If one ball is drawn at random, what is the probability that it is red?", "options": [{"label": "A", "text": "3/5"}, {"label": "B", "text": "1/2"}, {"label": "C", "text": "2/5"}, {"label": "D", "text": "4/6"}], "correct": "C", "explanation": "There are 4 red balls out of 10 total, so the probability = 4/10 = 2/5."}, {"num": 9, "category": "Aptitude", "question": "An article marked at Rs. 800 is sold after a 10% discount, still earning a profit of 12.5%. What is its cost price?", "options": [{"label": "A", "text": "Rs. 700"}, {"label": "B", "text": "Rs. 640"}, {"label": "C", "text": "Rs. 650"}, {"label": "D", "text": "Rs. 600"}], "correct": "B", "explanation": "Selling price = 800 * 0.90 = 720, and cost price = 720 / 1.125 = Rs. 640."}, {"num": 10, "category": "Python fundamentals", "question": "What is the output? print(\"a,b,,c\".split(\",\"))", "options": [{"label": "A", "text": "['a', 'b', 'c']"}, {"label": "B", "text": "['a', 'b', ' ', 'c']"}, {"label": "C", "text": "['a', 'b', '', 'c']"}, {"label": "D", "text": "Error"}], "correct": "C", "explanation": "split with an explicit separator does not merge consecutive separators, so the empty field between the two commas becomes an empty string."}, {"num": 11, "category": "Python fundamentals", "question": "What is the output? it = iter([1, 2]) next(it) print(next(it))", "options": [{"label": "A", "text": "2"}, {"label": "B", "text": "1"}, {"label": "C", "text": "[1, 2]"}, {"label": "D", "text": "StopIteration"}], "correct": "A", "explanation": "The first next(it) consumes 1, so the second next(it) returns 2."}, {"num": 12, "category": "Python fundamentals", "question": "What is the output? print(0.1 + 0.2 == 0.3)", "options": [{"label": "A", "text": "True"}, {"label": "B", "text": "Error"}, {"label": "C", "text": "None"}, {"label": "D", "text": "False"}], "correct": "D", "explanation": "Binary floating-point cannot represent 0.1, 0.2, and 0.3 exactly, so the sum is slightly off from 0.3 and the comparison is False."}, {"num": 13, "category": "Basics of OOPs", "question": "The `super()` call is most commonly used to:", "options": [{"label": "A", "text": "Dynamically create a new subclass at runtime"}, {"label": "B", "text": "Remove the parent class from the hierarchy"}, {"label": "C", "text": "Invoke a method (often the parent constructor) of the superclass"}, {"label": "D", "text": "Convert an instance method into a static method"}], "correct": "C", "explanation": "`super()` gives access to methods of the parent/ancestor class, letting a subclass extend rather than fully replace inherited behavior (e.g., calling the parent's `__init__`)."}, {"num": 14, "category": "Python fundamentals", "question": "Which of these values is truthy?", "options": [{"label": "A", "text": "0 (int)"}, {"label": "B", "text": "'' (empty string)"}, {"label": "C", "text": "'0' (non-empty string)"}, {"label": "D", "text": "[] (empty list)"}], "correct": "C", "explanation": "The string '0' is non-empty, so it is truthy; 0, the empty string, and the empty list are all falsy."}, {"num": 15, "category": "Python fundamentals", "question": "What does this print? print(-7 // 2)", "options": [{"label": "A", "text": "-3"}, {"label": "B", "text": "-3.5"}, {"label": "C", "text": "-4"}, {"label": "D", "text": "3"}], "correct": "C", "explanation": "Floor division rounds toward negative infinity, so -3.5 floors to -4."}, {"num": 16, "category": "Basics of OOPs", "question": "Encapsulation, as a pillar of OOP, primarily refers to:", "options": [{"label": "A", "text": "Hiding an object's internal state and requiring all interaction through its methods"}, {"label": "B", "text": "Deriving a new class from an existing one"}, {"label": "C", "text": "Allowing one interface to represent different underlying types"}, {"label": "D", "text": "Splitting a program into unrelated standalone functions"}], "correct": "A", "explanation": "Encapsulation bundles data with the methods that operate on it and restricts direct access to the internal state, exposing a controlled interface."}, {"num": 17, "category": "Basics of OOPs", "question": "What is the output? class Duck: def sound(self): return 'quack' class Person: def sound(self): return 'hello' def make_sound(x): return x.sound() print(make_sound(Person()))", "options": [{"label": "A", "text": "quack"}, {"label": "B", "text": "hello"}, {"label": "C", "text": "TypeError"}, {"label": "D", "text": "None"}], "correct": "B", "explanation": "`make_sound` does not check the type; it only requires a `sound()` method. Person provides one, so it returns 'hello' (duck typing)."}, {"num": 18, "category": "Python fundamentals", "question": "What is the output? try: print(1) raise ValueError() print(2) except ValueError: print(3) finally: print(4)", "options": [{"label": "A", "text": "1 2 3 4"}, {"label": "B", "text": "1 2 4"}, {"label": "C", "text": "1 4"}, {"label": "D", "text": "1 3 4"}], "correct": "D", "explanation": "print(1) runs, then the raise skips print(2) and jumps to the except (print 3), and finally runs (print 4): 1, 3, 4."}, {"num": 19, "category": "Python fundamentals", "question": "What is the output? a = [1, 2, 3] b = a b.append(4) print(len(a))", "options": [{"label": "A", "text": "3"}, {"label": "B", "text": "4"}, {"label": "C", "text": "Error"}, {"label": "D", "text": "[1, 2, 3, 4]"}], "correct": "B", "explanation": "b and a reference the same list object, so appending through b also changes a; its length becomes 4."}, {"num": 20, "category": "Basics of OOPs", "question": "What is the key distinction between method overriding and method overloading?", "options": [{"label": "A", "text": "Overriding changes only the return type, while overloading changes the method name"}, {"label": "B", "text": "Overriding redefines an inherited method with the same signature in a subclass; overloading defines multiple methods with the same name but different parameter lists"}, {"label": "C", "text": "Overriding and overloading are just two names for the same mechanism"}, {"label": "D", "text": "Overloading requires inheritance, whereas overriding does not"}], "correct": "B", "explanation": "Overriding replaces a parent method using the identical signature in a subclass (runtime dispatch); overloading provides several same-named methods distinguished by their parameters."}, {"num": 21, "category": "Basics of OOPs", "question": "What is the output? class Counter: n = 0 @classmethod def inc(cls): cls.n += 1 Counter.inc() Counter.inc() print(Counter.n)", "options": [{"label": "A", "text": "0"}, {"label": "B", "text": "1"}, {"label": "C", "text": "2"}, {"label": "D", "text": "Error"}], "correct": "C", "explanation": "The classmethod receives the class as `cls` and increments the shared class variable `n` each call; after two calls it is 2."}, {"num": 22, "category": "Basics of OOPs", "question": "Why is the advice 'favor composition over inheritance' commonly given?", "options": [{"label": "A", "text": "Composition is always faster than inheritance at runtime"}, {"label": "B", "text": "Inheritance is unsupported in most modern languages"}, {"label": "C", "text": "It avoids rigid, fragile class hierarchies and lets behavior be assembled and swapped more flexibly"}, {"label": "D", "text": "Composition eliminates the need to create objects"}], "correct": "C", "explanation": "Composition assembles behavior from independent parts, reducing the tight coupling and fragility that deep inheritance chains can create."}, {"num": 23, "category": "Aptitude", "question": "Find the simple interest on Rs. 5000 at 8% per annum for 3 years.", "options": [{"label": "A", "text": "Rs. 1440"}, {"label": "B", "text": "Rs. 1200"}, {"label": "C", "text": "Rs. 1300"}, {"label": "D", "text": "Rs. 1150"}], "correct": "B", "explanation": "SI = P*R*T/100 = 5000 * 8 * 3 / 100 = Rs. 1200."}, {"num": 24, "category": "Python fundamentals", "question": "What is the output? def gen(): yield 1 yield 2 print(list(gen()))", "options": [{"label": "A", "text": "1"}, {"label": "B", "text": "[1, 2]"}, {"label": "C", "text": "<generator>"}, {"label": "D", "text": "2"}], "correct": "B", "explanation": "list() drives the generator to completion, collecting each yielded value into [1, 2]."}, {"num": 25, "category": "Basics of OOPs", "question": "In Python, the `__str__` method is intended to:", "options": [{"label": "A", "text": "Return a readable, user-facing string, and it is what print() and str() use"}, {"label": "B", "text": "Return an unambiguous debugging representation, preferred by developers at the REPL"}, {"label": "C", "text": "Compare two objects for equality"}, {"label": "D", "text": "Initialize a newly created object"}], "correct": "A", "explanation": "`__str__` gives a human-readable representation used by `print()` and `str()`; the developer-oriented, unambiguous form is the job of `__repr__`."}, {"num": 26, "category": "Python fundamentals", "question": "Which of these built-in types is immutable?", "options": [{"label": "A", "text": "tuple"}, {"label": "B", "text": "list"}, {"label": "C", "text": "dict"}, {"label": "D", "text": "set"}], "correct": "A", "explanation": "Tuples cannot be changed after creation. Lists, dicts, and sets are all mutable."}, {"num": 27, "category": "Python fundamentals", "question": "What is the output? x = 0 print(\"yes\" if x else \"no\")", "options": [{"label": "A", "text": "no"}, {"label": "B", "text": "yes"}, {"label": "C", "text": "0"}, {"label": "D", "text": "Error"}], "correct": "A", "explanation": "0 is falsy, so the conditional expression evaluates the else branch and prints 'no'."}, {"num": 28, "category": "Basics of OOPs", "question": "Attempting to instantiate an abstract class directly typically results in:", "options": [{"label": "A", "text": "A fully functional object of the abstract type"}, {"label": "B", "text": "An error, because abstract classes cannot be instantiated directly"}, {"label": "C", "text": "A copy of its first concrete subclass"}, {"label": "D", "text": "A null reference with no usable methods"}], "correct": "B", "explanation": "Abstract classes are incomplete (they may declare methods with no implementation), so the language forbids creating instances of them directly; only concrete subclasses can be instantiated."}, {"num": 29, "category": "Python fundamentals", "question": "What is the output? def f(x, lst=[]): lst.append(x) return lst f(1) print(f(2))", "options": [{"label": "A", "text": "[2]"}, {"label": "B", "text": "[1]"}, {"label": "C", "text": "Error"}, {"label": "D", "text": "[1, 2]"}], "correct": "D", "explanation": "A default argument is evaluated once at definition time, so the same list persists across calls; after f(1) and f(2) it holds [1, 2]."}, {"num": 30, "category": "Aptitude", "question": "Pointing to a photograph, a girl says, 'She is the daughter of my grandfather's only son.' How is the girl in the photograph related to the girl speaking?", "options": [{"label": "A", "text": "Mother"}, {"label": "B", "text": "Sister"}, {"label": "C", "text": "Cousin"}, {"label": "D", "text": "Daughter"}], "correct": "B", "explanation": "The grandfather's only son is the speaker's father, so his daughter (in the photo) is the speaker's sister."}, {"num": 31, "category": "Basics of OOPs", "question": "What is the output? class Vec: def __init__(self, n): self.n = n def __add__(self, other): return Vec(self.n + other.n) v = Vec(2) + Vec(3) print(v.n)", "options": [{"label": "A", "text": "23"}, {"label": "B", "text": "Vec"}, {"label": "C", "text": "5"}, {"label": "D", "text": "TypeError"}], "correct": "C", "explanation": "Defining `__add__` overloads the `+` operator, so `Vec(2) + Vec(3)` returns a new Vec with n = 2 + 3 = 5."}, {"num": 32, "category": "Basics of OOPs", "question": "A `Car` object holds an `Engine` object as one of its fields. This design is an example of:", "options": [{"label": "A", "text": "composition (has-a)"}, {"label": "B", "text": "inheritance (is-a)"}, {"label": "C", "text": "polymorphism"}, {"label": "D", "text": "method overriding"}], "correct": "A", "explanation": "When one object contains another as a part of its state, it models a 'has-a' relationship, which is composition rather than inheritance."}, {"num": 33, "category": "Basics of OOPs", "question": "The Open/Closed Principle states that software entities should be:", "options": [{"label": "A", "text": "Open for modification but closed for extension"}, {"label": "B", "text": "Closed to both extension and modification"}, {"label": "C", "text": "Open for extension but closed for modification"}, {"label": "D", "text": "Open to both extension and modification with no constraints"}], "correct": "C", "explanation": "OCP says you should be able to add new behavior by extending code (e.g., via new subclasses or plugins) without altering existing, tested code."}, {"num": 34, "category": "Aptitude", "question": "Find the next letter in the series: A, C, F, J, ?", "options": [{"label": "A", "text": "M"}, {"label": "B", "text": "N"}, {"label": "C", "text": "O"}, {"label": "D", "text": "P"}], "correct": "C", "explanation": "The gaps between letters increase as +2, +3, +4, +5; from J (10th letter) adding 5 gives the 15th letter, O."}, {"num": 35, "category": "Basics of OOPs", "question": "A static (class-level) variable in most OOP languages is:", "options": [{"label": "A", "text": "Unique to each instance of the class"}, {"label": "B", "text": "Accessible only inside constructors"}, {"label": "C", "text": "Shared across all instances of the class"}, {"label": "D", "text": "Automatically made thread-safe by the language"}], "correct": "C", "explanation": "A static/class variable belongs to the class itself, so a single copy is shared by every instance rather than each object owning its own."}, {"num": 36, "category": "Python fundamentals", "question": "What is the output? print(sorted([-3, 1, -2], key=abs))", "options": [{"label": "A", "text": "[-3, -2, 1]"}, {"label": "B", "text": "[1, -2, -3]"}, {"label": "C", "text": "[-2, -3, 1]"}, {"label": "D", "text": "[1, 2, 3]"}], "correct": "B", "explanation": "sorted orders by the key (absolute value) 3, 1, 2, giving the order of the originals as 1, -2, -3."}, {"num": 37, "category": "Basics of OOPs", "question": "Duck typing means that:", "options": [{"label": "A", "text": "An object's suitability is judged by whether it provides the required methods/attributes, not by its declared type"}, {"label": "B", "text": "Every object must explicitly declare which interfaces it implements"}, {"label": "C", "text": "Only objects whose class is literally named Duck may be passed"}, {"label": "D", "text": "All types are checked strictly at compile time before running"}], "correct": "A", "explanation": "With duck typing, if an object has the needed behavior ('walks and quacks like a duck'), it can be used, regardless of its formal class or declared interfaces."}, {"num": 38, "category": "Python fundamentals", "question": "What is the output? d = {1: 'a', 2: 'b'} d[1] = 'c' print(d)", "options": [{"label": "A", "text": "{1: 'c', 2: 'b'}"}, {"label": "B", "text": "{1: 'a', 2: 'b', 1: 'c'}"}, {"label": "C", "text": "{2: 'b', 1: 'c'}"}, {"label": "D", "text": "Error"}], "correct": "A", "explanation": "Assigning to an existing key updates its value in place and preserves insertion order, so key 1 keeps its position with value 'c'."}, {"num": 39, "category": "Python fundamentals", "question": "What is the output? print(list(map(lambda x: x * 2, filter(lambda x: x > 1, [1, 2, 3]))))", "options": [{"label": "A", "text": "[2, 4, 6]"}, {"label": "B", "text": "[2, 6]"}, {"label": "C", "text": "[4, 6]"}, {"label": "D", "text": "[4]"}], "correct": "C", "explanation": "filter keeps values greater than 1 (2 and 3), then map doubles them to [4, 6]."}, {"num": 40, "category": "Python fundamentals", "question": "What is the output? d = {'a': 1, 'b': 2} print(d.get('c', 0))", "options": [{"label": "A", "text": "None"}, {"label": "B", "text": "KeyError"}, {"label": "C", "text": "'c'"}, {"label": "D", "text": "0"}], "correct": "D", "explanation": "dict.get returns the supplied default (0) when the key is absent, instead of raising KeyError."}, {"num": 41, "category": "Basics of OOPs", "question": "Which statement best describes the relationship between a class and an object?", "options": [{"label": "A", "text": "A class is an instance of an object created at runtime"}, {"label": "B", "text": "A class and an object are two names for the same runtime entity"}, {"label": "C", "text": "A class is a blueprint or template, and an object is a concrete instance of it"}, {"label": "D", "text": "An object is a blueprint from which many classes are derived"}], "correct": "C", "explanation": "A class defines structure and behavior (a template); each object is a distinct runtime instance created from that template with its own state."}, {"num": 42, "category": "Basics of OOPs", "question": "A `Car` class extends (inherits from) a `Vehicle` class. This best models which kind of relationship?", "options": [{"label": "A", "text": "has-a"}, {"label": "B", "text": "is-a"}, {"label": "C", "text": "uses-a"}, {"label": "D", "text": "part-of"}], "correct": "B", "explanation": "Inheritance models an 'is-a' relationship: a Car is a kind of Vehicle, so it inherits the general characteristics of Vehicle."}, {"num": 43, "category": "Aptitude", "question": "What is the remainder when 2^32 is divided by 7?", "options": [{"label": "A", "text": "1"}, {"label": "B", "text": "2"}, {"label": "C", "text": "4"}, {"label": "D", "text": "5"}], "correct": "C", "explanation": "Since 2^3 = 8 leaves remainder 1 on division by 7, 2^32 = (2^3)^10 * 2^2 leaves remainder 1^10 * 4 = 4."}, {"num": 44, "category": "Aptitude", "question": "Two trains, 200 m and 300 m long, move in opposite directions at 60 km/h and 40 km/h respectively. How long do they take to completely cross each other?", "options": [{"label": "A", "text": "15 s"}, {"label": "B", "text": "20 s"}, {"label": "C", "text": "18 s"}, {"label": "D", "text": "25 s"}], "correct": "C", "explanation": "Relative speed = 100 km/h = 250/9 m/s and total length = 500 m, so time = 500 / (250/9) = 18 seconds."}, {"num": 45, "category": "Basics of OOPs", "question": "In Python, the `__del__` method (a destructor) is invoked:", "options": [{"label": "A", "text": "Immediately and deterministically when the variable leaves scope"}, {"label": "B", "text": "When the object is about to be destroyed / garbage-collected"}, {"label": "C", "text": "Every time one of the object's attributes is accessed"}, {"label": "D", "text": "At the moment the object is first created"}], "correct": "B", "explanation": "`__del__` is called as an object is being reclaimed by the garbage collector; the exact timing is not guaranteed because Python manages memory automatically."}, {"num": 46, "category": "Python fundamentals", "question": "What is the output? def outer(): x = 1 def inner(): nonlocal x x += 1 return x return inner() print(outer())", "options": [{"label": "A", "text": "1"}, {"label": "B", "text": "Error"}, {"label": "C", "text": "None"}, {"label": "D", "text": "2"}], "correct": "D", "explanation": "nonlocal lets inner rebind the enclosing x, incrementing it from 1 to 2."}, {"num": 47, "category": "Basics of OOPs", "question": "A `@staticmethod` differs from a regular instance method in that it:", "options": [{"label": "A", "text": "Automatically receives the instance as its first argument"}, {"label": "B", "text": "Can be invoked only on instances, never on the class"}, {"label": "C", "text": "Always mutates a class variable when called"}, {"label": "D", "text": "Receives neither the instance (self) nor the class (cls) automatically"}], "correct": "D", "explanation": "A static method is a plain function namespaced under the class; it gets no implicit `self` or `cls`, so it cannot access instance or class state unless passed explicitly."}, {"num": 48, "category": "Basics of OOPs", "question": "In Python, the first parameter `self` of an instance method refers to:", "options": [{"label": "A", "text": "The class object itself"}, {"label": "B", "text": "A value-copy of the object"}, {"label": "C", "text": "The parent class of the object"}, {"label": "D", "text": "The particular instance the method was called on"}], "correct": "D", "explanation": "`self` is a reference to the specific instance on which the method was invoked, giving the method access to that instance's attributes."}, {"num": 49, "category": "Python fundamentals", "question": "What is the output? try: x = 1 except Exception: print(\"except\") else: print(\"else\") finally: print(\"finally\")", "options": [{"label": "A", "text": "except then finally"}, {"label": "B", "text": "only finally"}, {"label": "C", "text": "else then finally"}, {"label": "D", "text": "only else"}], "correct": "C", "explanation": "No exception is raised, so the else block runs, and finally always runs; the output is 'else' then 'finally'."}, {"num": 50, "category": "Python fundamentals", "question": "What is the output? print([x * x for x in range(4)])", "options": [{"label": "A", "text": "[1, 4, 9]"}, {"label": "B", "text": "[0, 1, 4, 9]"}, {"label": "C", "text": "[0, 1, 4, 9, 16]"}, {"label": "D", "text": "[1, 4, 9, 16]"}], "correct": "B", "explanation": "range(4) yields 0, 1, 2, 3, and squaring each gives [0, 1, 4, 9]."}, {"num": 51, "category": "Aptitude", "question": "Find the next term in the series: 2, 6, 12, 20, 30, ?", "options": [{"label": "A", "text": "40"}, {"label": "B", "text": "44"}, {"label": "C", "text": "36"}, {"label": "D", "text": "42"}], "correct": "D", "explanation": "The differences are 4, 6, 8, 10 and the next difference is 12, so the next term is 30 + 12 = 42."}, {"num": 52, "category": "Basics of OOPs", "question": "The Single Responsibility Principle (the 'S' in SOLID) states that:", "options": [{"label": "A", "text": "A class should contain no more than one method"}, {"label": "B", "text": "A class should have only one reason to change (a single, well-defined responsibility)"}, {"label": "C", "text": "A class should never be used as a base class"}, {"label": "D", "text": "A class should expose only static members"}], "correct": "B", "explanation": "SRP says a class should encapsulate one responsibility so that only one kind of change forces it to be modified; it is about responsibilities, not a literal count of methods."}, {"num": 53, "category": "Basics of OOPs", "question": "Which statement about abstract classes and interfaces (classic Java) is correct?", "options": [{"label": "A", "text": "A class may implement multiple interfaces but, in Java, extend only one class"}, {"label": "B", "text": "An abstract class is forbidden from containing any implemented methods"}, {"label": "C", "text": "A classic Java interface can hold mutable instance state just like an abstract class"}, {"label": "D", "text": "An abstract class can be instantiated directly with new"}], "correct": "A", "explanation": "Java supports single class inheritance but multiple interface implementation; abstract classes may have implemented methods, and interfaces traditionally hold no instance state."}, {"num": 54, "category": "Aptitude", "question": "A shop's monthly sales (in units) were Jan 120, Feb 150, Mar 180, Apr 150. What was the average monthly sales over these four months?", "options": [{"label": "A", "text": "150"}, {"label": "B", "text": "145"}, {"label": "C", "text": "160"}, {"label": "D", "text": "140"}], "correct": "A", "explanation": "Total sales = 120 + 150 + 180 + 150 = 600, so the average = 600/4 = 150 units."}, {"num": 55, "category": "Basics of OOPs", "question": "In Python, prefixing an attribute name with a single underscore (e.g. `_value`) conventionally signals:", "options": [{"label": "A", "text": "That the attribute is intended for internal use and should be treated as non-public by convention only"}, {"label": "B", "text": "That the attribute is truly private and cannot be accessed at all"}, {"label": "C", "text": "That Python will apply name mangling to the attribute"}, {"label": "D", "text": "That the attribute is a class-level (static) variable"}], "correct": "A", "explanation": "A single leading underscore is only a convention indicating 'internal use'; Python does not enforce any access restriction (name mangling requires two underscores)."}, {"num": 56, "category": "Basics of OOPs", "question": "Which of the following best captures abstraction as an OOP pillar?", "options": [{"label": "A", "text": "Copying the fields of one class into another"}, {"label": "B", "text": "Storing data and the methods that operate on it in a single unit"}, {"label": "C", "text": "Overloading an operator for a custom type"}, {"label": "D", "text": "Exposing only essential features while hiding unnecessary implementation detail"}], "correct": "D", "explanation": "Abstraction means presenting a simplified, essential view of an entity to its users while concealing the underlying complexity."}, {"num": 57, "category": "Basics of OOPs", "question": "A `Teacher` class and a `Student` class where each may reference the other but neither owns or controls the other's lifetime best illustrates:", "options": [{"label": "A", "text": "Association"}, {"label": "B", "text": "Inheritance"}, {"label": "C", "text": "Composition"}, {"label": "D", "text": "Encapsulation"}], "correct": "A", "explanation": "A loose link between independent objects with no ownership is a plain association; composition and aggregation are stronger 'has-a/part-of' forms of association."}, {"num": 58, "category": "Basics of OOPs", "question": "What is the output? class Cat: def sound(self): return 'meow' class Dog: def sound(self): return 'woof' for a in [Cat(), Dog()]: print(a.sound(), end=' ')", "options": [{"label": "A", "text": "meow meow"}, {"label": "B", "text": "woof woof"}, {"label": "C", "text": "Error"}, {"label": "D", "text": "meow woof"}], "correct": "D", "explanation": "The loop calls sound() polymorphically on each object; the Cat returns 'meow' and the Dog returns 'woof', printing 'meow woof '."}, {"num": 59, "category": "Basics of OOPs", "question": "What is the output? class Animal: def speak(self): return 'sound' class Dog(Animal): def speak(self): return super().speak() + ' bark' print(Dog().speak())", "options": [{"label": "A", "text": "sound"}, {"label": "B", "text": "bark"}, {"label": "C", "text": "AttributeError: super has no speak"}, {"label": "D", "text": "sound bark"}], "correct": "D", "explanation": "`super().speak()` calls Animal.speak() returning 'sound', which is concatenated with ' bark' to give 'sound bark'."}, {"num": 60, "category": "Python fundamentals", "question": "What is the output? s = \"python\" print(s[1:4])", "options": [{"label": "A", "text": "yth"}, {"label": "B", "text": "pyt"}, {"label": "C", "text": "ytho"}, {"label": "D", "text": "hon"}], "correct": "A", "explanation": "Slicing [1:4] takes indices 1, 2, 3 (the stop index is exclusive): 'y', 't', 'h'."}, {"num": 61, "category": "Aptitude", "question": "A man walks 10 m towards north, then turns right and walks 10 m, then turns right again and walks 10 m. How far and in which direction is he from the starting point?", "options": [{"label": "A", "text": "20 m north"}, {"label": "B", "text": "14 m north-east"}, {"label": "C", "text": "10 m east"}, {"label": "D", "text": "0 m (at start)"}], "correct": "C", "explanation": "The moves are 10 m N, 10 m E, 10 m S; the north and south cancel, leaving him 10 m due east of the start."}, {"num": 62, "category": "Python fundamentals", "question": "What is the output? print(-7 % 3)", "options": [{"label": "A", "text": "2"}, {"label": "B", "text": "-1"}, {"label": "C", "text": "1"}, {"label": "D", "text": "-2"}], "correct": "A", "explanation": "In Python the result of % takes the sign of the divisor, so -7 % 3 is 2 (since -7 = -3*3 + 2)."}, {"num": 63, "category": "Basics of OOPs", "question": "Python determines the order in which base classes are searched for a method using:", "options": [{"label": "A", "text": "Random choice among the available parent classes"}, {"label": "B", "text": "Alphabetical order of the parent class names"}, {"label": "C", "text": "The order in which the methods happened to be defined"}, {"label": "D", "text": "The C3 linearization algorithm (its Method Resolution Order)"}], "correct": "D", "explanation": "Python computes a deterministic Method Resolution Order via the C3 linearization, which fixes the sequence in which classes are checked for an attribute."}, {"num": 64, "category": "Python fundamentals", "question": "What is the output? print(bool([]))", "options": [{"label": "A", "text": "True"}, {"label": "B", "text": "False"}, {"label": "C", "text": "None"}, {"label": "D", "text": "Error"}], "correct": "B", "explanation": "An empty list is falsy, so bool([]) is False."}, {"num": 65, "category": "Python fundamentals", "question": "What is the output? x = 10 def f(): x = 20 f() print(x)", "options": [{"label": "A", "text": "20"}, {"label": "B", "text": "None"}, {"label": "C", "text": "10"}, {"label": "D", "text": "Error"}], "correct": "C", "explanation": "Assigning x inside f creates a new local variable; the global x is untouched, so 10 is printed."}, {"num": 66, "category": "Aptitude", "question": "In what ratio must rice at Rs. 20/kg be mixed with rice at Rs. 30/kg to obtain a mixture worth Rs. 24/kg?", "options": [{"label": "A", "text": "3 : 2"}, {"label": "B", "text": "2 : 3"}, {"label": "C", "text": "1 : 2"}, {"label": "D", "text": "3 : 1"}], "correct": "A", "explanation": "By alligation, ratio = (30 - 24) : (24 - 20) = 6 : 4 = 3 : 2."}, {"num": 67, "category": "Aptitude", "question": "A number is first increased by 20% and then the result is decreased by 20%. What is the net change on the original number?", "options": [{"label": "A", "text": "No change"}, {"label": "B", "text": "4% increase"}, {"label": "C", "text": "2% decrease"}, {"label": "D", "text": "4% decrease"}], "correct": "D", "explanation": "Multiplying factors give 1.20 * 0.80 = 0.96, i.e. the final value is 96% of the original, a 4% decrease."}, {"num": 68, "category": "Aptitude", "question": "If 6 men can complete a job in 12 days, how many days will 9 men take to complete the same job (working at the same rate)?", "options": [{"label": "A", "text": "9 days"}, {"label": "B", "text": "8 days"}, {"label": "C", "text": "6 days"}, {"label": "D", "text": "10 days"}], "correct": "B", "explanation": "Total work = 6 * 12 = 72 man-days, so time for 9 men = 72/9 = 8 days."}, {"num": 69, "category": "Python fundamentals", "question": "What is the output? for i in range(3): if i == 5: break else: print(\"done\")", "options": [{"label": "A", "text": "(no output)"}, {"label": "B", "text": "done"}, {"label": "C", "text": "0 1 2"}, {"label": "D", "text": "Error"}], "correct": "B", "explanation": "A loop's else clause runs when the loop finishes without hitting break; since i never equals 5, break is skipped and 'done' prints."}, {"num": 70, "category": "Basics of OOPs", "question": "Which statement best defines polymorphism?", "options": [{"label": "A", "text": "The ability to hide data behind private fields"}, {"label": "B", "text": "The ability to define multiple constructors in one class"}, {"label": "C", "text": "The ability of different types to be accessed through a common interface, with the actual behavior resolved at call time"}, {"label": "D", "text": "The ability to inherit from multiple parent classes"}], "correct": "C", "explanation": "Polymorphism lets a single interface work with objects of different types, where the specific method executed is determined by the actual object."}, {"num": 71, "category": "Python fundamentals", "question": "What is the output? import copy a = [[1, 2], [3, 4]] b = copy.copy(a) b[0].append(9) print(a[0])", "options": [{"label": "A", "text": "[1, 2]"}, {"label": "B", "text": "Error"}, {"label": "C", "text": "[[1, 2, 9], [3, 4]]"}, {"label": "D", "text": "[1, 2, 9]"}], "correct": "D", "explanation": "A shallow copy copies the outer list but shares the inner list objects, so appending to b[0] also affects a[0], making it [1, 2, 9]."}, {"num": 72, "category": "Aptitude", "questio o its subclasses (even in other packages), and to any class in the same package."}, {"num": 98, "category": "Basics of OOPs", "question": "In Python, if a class body defines two methods with the same name but different parameter lists, what happens?", "options": [{"label": "A", "text": "Both become callable overloads chosen by argument count"}, {"label": "B", "text": "The second definition simply replaces the first; only the last-defined method exists"}, {"label": "C", "text": "It raises a syntax error at definition time"}, {"label": "D", "text": "Python automatically merges them into one variadic method"}], "correct": "B", "explanation": "Python has no built-in method overloading; the later definition rebinds the name, so only the last method with that name remains."}, {"num": 99, "category": "Python fundamentals", "question": "What is the output? s = {1, 2, 2, 3, 3, 3} print(len(s))", "options": [{"label": "A", "text": "6"}, {"label": "B", "text": "1"}, {"label": "C", "text": "3"}, {"label": "D", "text": "Error"}], "correct": "C", "explanation": "Sets store only unique elements, so duplicates collapse to {1, 2, 3}, giving length 3."}, {"num": 100, "category": "Python fundamentals", "question": "What is the output? print({x: x ** 2 for x in range(3)})", "options": [{"label": "A", "text": "{1: 1, 2: 4}"}, {"label": "B", "text": "{0: 0, 1: 2, 2: 4}"}, {"label": "C", "text": "{0: 0, 1: 1, 2: 4}"}, {"label": "D", "text": "[0, 1, 4]"}], "correct": "C", "explanation": "The dict comprehension maps each x in 0, 1, 2 to its square: {0: 0, 1: 1, 2: 4}."}, {"num": 101, "category": "Machine Learning", "question": "In a large language model, lowering the sampling temperature towards 0 makes the output:", "options": [{"label": "A", "text": "More accurate, because temperature controls the model's knowledge"}, {"label": "B", "text": "Longer, since the model stops early less often"}, {"label": "C", "text": "More deterministic and repetitive, since the highest-probability token is almost always chosen"}, {"label": "D", "text": "More creative and varied"}], "correct": "C", "explanation": "Temperature reshapes the probability distribution before a token is sampled. Near 0 it collapses onto the single most likely token, so the same prompt returns nearly the same answer; higher values flatten the distribution and let less likely tokens through."}, {"num": 102, "category": "Aptitude", "question": "Arrange these steps in their logical order: 1. Diagnosis  2. Symptoms  3. Treatment  4. Recovery  5. Illness", "options": [{"label": "A", "text": "2, 5, 1, 3, 4"}, {"label": "B", "text": "5, 1, 2, 3, 4"}, {"label": "C", "text": "1, 2, 5, 3, 4"}, {"label": "D", "text": "5, 2, 1, 3, 4"}], "correct": "D", "explanation": "The illness comes first, it produces symptoms, the symptoms lead to a diagnosis, the diagnosis leads to treatment, and treatment leads to recovery: 5, 2, 1, 3, 4."}, {"num": 103, "category": "Programming & CS", "question": "What is the output?\n\nm = [[1, 2], [3, 4]]\nprint(list(zip(*m)))", "options": [{"label": "A", "text": "[(1, 2), (3, 4)]"}, {"label": "B", "text": "[[1, 3], [2, 4]]"}, {"label": "C", "text": "[(1, 3), (2, 4)]"}, {"label": "D", "text": "[(1, 2, 3, 4)]"}], "correct": "C", "explanation": "*m unpacks the rows as separate arguments, so zip pairs the first elements together and the second elements together - the standard idiom for transposing a matrix."}, {"num": 104, "category": "Programming & CS", "question": "What is the output?\n\na = [1, 2, 3, 4, 5]\na[1:4] = [9]\nprint(a)", "options": [{"label": "A", "text": "[1, 9, 4, 5]"}, {"label": "B", "text": "[1, 9, 5]"}, {"label": "C", "text": "[1, [9], 5]"}, {"label": "D", "text": "[1, 9, 3, 4, 5]"}], "correct": "B", "explanation": "Assigning to a slice replaces that whole stretch with the contents of the right-hand list. Positions 1, 2 and 3 are removed and the single element 9 is spliced in, leaving [1, 9, 5]."}, {"num": 105, "category": "Programming & CS", "question": "A REST API responds with HTTP status 404. What does that mean?", "options": [{"label": "A", "text": "The request was refused because the caller is not authenticated"}, {"label": "B", "text": "The server encountered an internal error"}, {"label": "C", "text": "The requested resource was not found"}, {"label": "D", "text": "The request succeeded but returned no content"}], "correct": "C", "explanation": "404 is Not Found. 401 is unauthenticated, 403 is authenticated but not permitted, 500 is a server-side failure, and 204 is success with no content."}, {"num": 106, "category": "Programming & CS", "question": "When would you choose JSON over CSV for a data file?", "options": [{"label": "A", "text": "When the file must open in a spreadsheet"}, {"label": "B", "text": "When the data is purely numeric"}, {"label": "C", "text": "When the records are nested or their fields vary between records"}, {"label": "D", "text": "When the file has to be as small as possible"}], "correct": "C", "explanation": "CSV is a flat grid: every row has the same columns, and nothing nests. JSON carries hierarchy and optional fields naturally, at the cost of a larger file and slower parsing for simple tabular data."}, {"num": 107, "category": "Programming & CS", "question": "What is the output?\n\nd = {\"a\": 3, \"b\": 1, \"c\": 2}\nprint(sorted(d, key=d.get))", "options": [{"label": "A", "text": "[1, 2, 3]"}, {"label": "B", "text": "['b', 'c', 'a']"}, {"label": "C", "text": "['a', 'c', 'b']"}, {"label": "D", "text": "['a', 'b', 'c']"}], "correct": "B", "explanation": "Iterating a dict yields its keys, and key=d.get sorts those keys by their values: b (1), then c (2), then a (3)."}, {"num": 108, "category": "Aptitude", "question": "What is the last digit of 7 raised to the power 105?", "options": [{"label": "A", "text": "9"}, {"label": "B", "text": "1"}, {"label": "C", "text": "3"}, {"label": "D", "text": "7"}], "correct": "D", "explanation": "The last digit of powers of 7 repeats in a cycle of four: 7, 9, 3, 1. Since 105 divided by 4 leaves remainder 1, the last digit is the first in the cycle, 7."}, {"num": 109, "category": "Aptitude", "question": "Pipe A alone fills a tank in 6 hours and pipe B alone fills it in 4 hours. If both are opened together, how long does the tank take to fill?", "options": [{"label": "A", "text": "2 hours 40 minutes"}, {"label": "B", "text": "5 hours"}, {"label": "C", "text": "2 hours 30 minutes"}, {"label": "D", "text": "2 hours 24 minutes"}], "correct": "D", "explanation": "In one hour A fills 1/6 of the tank and B fills 1/4, so together they fill 1/6 + 1/4 = 5/12 per hour. The tank therefore takes 12/5 = 2.4 hours, which is 2 hours 24 minutes."}, {"num": 110, "category": "Programming & CS", "question": "What is the output?\n\nprint(f\"{7 / 3:.2f}\")", "options": [{"label": "A", "text": "2.34"}, {"label": "B", "text": "2"}, {"label": "C", "text": "2.33"}, {"label": "D", "text": "2.3"}], "correct": "C", "explanation": "7/3 is 2.333..., and the .2f format rounds it to two decimal places and keeps the trailing digits, giving 2.33."}, {"num": 111, "category": "Programming & CS", "question": "What is the output?\n\nprint(list(range(5, 0, -2)))", "options": [{"label": "A", "text": "[5, 3, 1, -1]"}, {"label": "B", "text": "[4, 2, 0]"}, {"label": "C", "text": "[5, 3, 1]"}, {"label": "D", "text": "[5, 4, 3, 2, 1]"}], "correct": "C", "explanation": "range counts down from 5 in steps of 2 and stops before reaching the end value 0, so it yields 5, 3 and 1."}, {"num": 112, "category": "Programming & CS", "question": "What is the difference between git merge and git rebase?", "options": [{"label": "A", "text": "Merge discards your commits; rebase keeps them"}, {"label": "B", "text": "Rebase replays your commits on top of the target branch, giving a linear history; merge creates a merge commit and keeps both histories as they happened"}, {"label": "C", "text": "They produce identical histories and differ only in speed"}, {"label": "D", "text": "Rebase is for remote branches and merge is for local branches only"}], "correct": "B", "explanation": "Because rebase rewrites commit hashes, the usual rule is to rebase only branches nobody else has pulled, and to merge anything already shared."}, {"num": 113, "category": "Programming & CS", "question": "Breadth-first search on a graph is implemented with which data structure?", "options": [{"label": "A", "text": "A hash set only"}, {"label": "B", "text": "A stack"}, {"label": "C", "text": "A queue"}, {"label": "D", "text": "A priority queue ordered by node value"}], "correct": "C", "explanation": "BFS must finish one whole level before starting the next, and a first-in-first-out queue delivers exactly that order. Swapping the queue for a stack turns the same code into depth-first search."}, {"num": 114, "category": "Aptitude", "question": "A invests Rs. 30,000 and B invests Rs. 45,000 in a business for the same period. If the year's profit is Rs. 25,000, what is B's share?", "options": [{"label": "A", "text": "Rs. 12,500"}, {"label": "B", "text": "Rs. 15,000"}, {"label": "C", "text": "Rs. 10,000"}, {"label": "D", "text": "Rs. 18,000"}], "correct": "B", "explanation": "For equal time periods the profit is split in the ratio of the capitals, 30,000 : 45,000 = 2 : 3. B's share is 3/5 of 25,000 = Rs. 15,000."}, {"num": 115, "category": "Programming & CS", "question": "What happens when this code runs?\n\nfrom abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\nclass Circle(Shape):\n    pass\n\nCircle()", "options": [{"label": "A", "text": "It raises TypeError, because Circle does not implement the abstract method area"}, {"label": "B", "text": "It runs fine and creates a Circle whose area() returns None"}, {"label": "C", "text": "It raises a SyntaxError on the class definition"}, {"label": "D", "text": "It raises NotImplementedError from area()"}], "correct": "A", "explanation": "An ABC with an unimplemented abstract method cannot be instantiated. Python refuses at construction time with a TypeError, rather than waiting for someone to call area()."}, {"num": 116, "category": "Programming & CS", "question": "What is the output?\n\nprint(\"-\".join(str(x) for x in range(3)))", "options": [{"label": "A", "text": "0-1-2-"}, {"label": "B", "text": "012"}, {"label": "C", "text": "[0, 1, 2]"}, {"label": "D", "text": "0-1-2"}], "correct": "D", "explanation": "join puts the separator *between* items, never at the ends, so the three strings '0', '1' and '2' come back as 0-1-2."}, {"num": 117, "category": "Aptitude", "question": "A shirt is offered at two successive discounts of 20% and then 10%. This is equivalent to a single discount of:", "options": [{"label": "A", "text": "28%"}, {"label": "B", "text": "26%"}, {"label": "C", "text": "30%"}, {"label": "D", "text": "27%"}], "correct": "A", "explanation": "Successive discounts multiply rather than add: the customer pays 0.80 x 0.90 = 0.72 of the marked price, so 28% is taken off, not 30%."}, {"num": 118, "category": "Programming & CS", "question": "What is the difference between WHERE and HAVING?", "options": [{"label": "A", "text": "HAVING filters rows before grouping; WHERE filters after"}, {"label": "B", "text": "WHERE works on numbers and HAVING on text"}, {"label": "C", "text": "WHERE filters individual rows before grouping; HAVING filters the groups after aggregation"}, {"label": "D", "text": "They are interchangeable - HAVING is just the older keyword"}], "correct": "C", "explanation": "That ordering is why an aggregate such as COUNT(*) > 2 belongs in HAVING: the count does not exist yet when WHERE runs."}, {"num": 119, "category": "Programming & CS", "question": "The undo history of a text editor is most naturally modelled by which data structure?", "options": [{"label": "A", "text": "A binary search tree, because actions must stay sorted"}, {"label": "B", "text": "A queue, because actions are undone in the order they were made"}, {"label": "C", "text": "A hash table, because each action needs a key"}, {"label": "D", "text": "A stack, because the most recent action is the first to be undone"}], "correct": "D", "explanation": "Undo is last-in-first-out: the edit you made a moment ago is the one that comes off first. That is exactly a stack's push/pop behaviour."}, {"num": 120, "category": "Programming & CS", "question": "What is the output?\n\ndef f(n):\n    if n <= 1:\n        return 1\n    return n * f(n - 1)\n\nprint(f(4))", "options": [{"label": "A", "text": "RecursionError"}, {"label": "B", "text": "4"}, {"label": "C", "text": "10"}, {"label": "D", "text": "24"}], "correct": "D", "explanation": "This is factorial: 4 x 3 x 2 x f(1), and f(1) hits the base case and returns 1. 4 x 3 x 2 x 1 = 24."}, {"num": 121, "category": "Programming & CS", "question": "What is the output?\n\na = {1, 2, 3}\nb = {3, 4}\nprint(a - b, a & b)", "options": [{"label": "A", "text": "{4} {3}"}, {"label": "B", "text": "{1, 2} {1, 2, 3, 4}"}, {"label": "C", "text": "{1, 2, 4} {3}"}, {"label": "D", "text": "{1, 2} {3}"}], "correct": "D", "explanation": "- is set difference (what is in a but not in b) and & is intersection (what is in both), giving {1, 2} and {3}."}, {"num": 122, "category": "Machine Learning", "question": "A classifier has precision 0.80 and recall 0.50. What is its F1 score (to two decimal places)?", "options": [{"label": "A", "text": "0.65"}, {"label": "B", "text": "0.30"}, {"label": "C", "text": "0.40"}, {"label": "D", "text": "0.62"}], "correct": "D", "explanation": "F1 is the harmonic mean: 2 x precision x recall / (precision + recall) = 2 x 0.8 x 0.5 / 1.3 = 0.8/1.3 = 0.615, which rounds to 0.62. The harmonic mean stays close to the weaker of the two, which is why 0.65 (the plain average) is too generous."}, {"num": 123, "category": "Aptitude", "question": "A car covers the first half of a journey at 40 km/h and the second half at 60 km/h. What is its average speed for the whole journey?", "options": [{"label": "A", "text": "52 km/h"}, {"label": "B", "text": "50 km/h"}, {"label": "C", "text": "45 km/h"}, {"label": "D", "text": "48 km/h"}], "correct": "D", "explanation": "Average speed is total distance over total time, not the average of the two speeds. For equal halves it is the harmonic mean: 2 x 40 x 60 / (40 + 60) = 4800/100 = 48 km/h."}, {"num": 124, "category": "Programming & CS", "question": "In Python, a class that defines __eq__ but not __hash__ becomes:", "options": [{"label": "A", "text": "Unhashable, so its instances cannot be used in a set or as dictionary keys"}, {"label": "B", "text": "Unable to be compared with =="}, {"label": "C", "text": "Hashable by identity, exactly as before"}, {"label": "D", "text": "Immutable"}], "correct": "A", "explanation": "Python sets __hash__ to None when you define __eq__, because two objects that compare equal must hash equally and the default identity hash would break that. Define __hash__ as well if the instances need to live in sets or dicts."}, {"num": 125, "category": "Programming & CS", "question": "What is the output?\n\nprint(all([]), any([]))", "options": [{"label": "A", "text": "False True"}, {"label": "B", "text": "True True"}, {"label": "C", "text": "True False"}, {"label": "D", "text": "False False"}], "correct": "C", "explanation": "all() is vacuously True on an empty iterable - there is no element that fails - while any() needs at least one true element and so is False."}, {"num": 126, "category": "Programming & CS", "question": "A phone column has 10 rows, 3 of which are NULL. What does SELECT COUNT(*), COUNT(phone) FROM contacts return?", "options": [{"label": "A", "text": "10, 10"}, {"label": "B", "text": "7, 10"}, {"label": "C", "text": "7, 7"}, {"label": "D", "text": "10, 7"}], "correct": "D", "explanation": "COUNT(*) counts rows regardless of content, while COUNT(column) counts only the rows where that column is not NULL. The gap between the two is a quick way to spot missing values."}, {"num": 127, "category": "Programming & CS", "question": "What is the output?\n\nt = (1, [2, 3])\nt[1].append(4)\nprint(t)", "options": [{"label": "A", "text": "(1, [2, 3, 4])"}, {"label": "B", "text": "TypeError: 'tuple' object does not support item assignment"}, {"label": "C", "text": "(1, [2, 3], 4)"}, {"label": "D", "text": "(1, [2, 3])"}], "correct": "A", "explanation": "A tuple is immutable in what it *refers to*, not in what those objects contain. The list inside it is still mutable, so appending to it succeeds."}, {"num": 128, "category": "Programming & CS", "question": "customers has 100 rows. orders has 30 rows, belonging to 20 distinct customers. How many rows does SELECT * FROM customers LEFT JOIN orders ON orders.customer_id = customers.id return?", "options": [{"label": "A", "text": "30"}, {"label": "B", "text": "130"}, {"label": "C", "text": "110"}, {"label": "D", "text": "100"}], "correct": "C", "explanation": "The 20 customers who have orders contribute one row per order, which is 30 rows. The other 80 customers contribute one row each with NULLs on the orders side. 30 + 80 = 110."}, {"num": 129, "category": "Programming & CS", "question": "What is the time complexity of this loop in terms of n?\n\ntotal = 0\nfor i in range(n):\n    for j in range(i):\n        total += 1", "options": [{"label": "A", "text": "O(log n)"}, {"label": "B", "text": "O(n log n)"}, {"label": "C", "text": "O(n)"}, {"label": "D", "text": "O(n^2)"}], "correct": "D", "explanation": "The inner loop runs 0, then 1, then 2 ... up to n-1 times, and those add up to n(n-1)/2. Constants and lower-order terms drop out, leaving O(n^2) - the triangle is half the square, but it is still quadratic."}, {"num": 130, "category": "Programming & CS", "question": "What is the output?\n\nclass Temp:\n    def __init__(self, c):\n        self._c = c\n\n    @property\n    def f(self):\n        return self._c * 9 / 5 + 32\n\nt = Temp(100)\nprint(t.f)", "options": [{"label": "A", "text": "TypeError: 'property' object is not callable"}, {"label": "B", "text": "<property object>"}, {"label": "C", "text": "212"}, {"label": "D", "text": "212.0"}], "correct": "D", "explanation": "@property turns the method into a computed attribute, so t.f runs the body without parentheses. 100 * 9 / 5 + 32 = 212.0, a float because / always produces one."}, {"num": 131, "category": "Aptitude", "question": "Statements: Some doctors are writers. All writers are readers. Which conclusion definitely follows?", "options": [{"label": "A", "text": "All doctors are readers"}, {"label": "B", "text": "Some doctors are readers"}, {"label": "C", "text": "All readers are writers"}, {"label": "D", "text": "No doctor is a reader"}], "correct": "B", "explanation": "The doctors who are writers must be readers, because every writer is a reader - so 'some doctors are readers' is guaranteed. Nothing is said about the remaining doctors, so 'all doctors are readers' does not follow."}, {"num": 132, "category": "Machine Learning", "question": "In a language model, a 'token' is:", "options": [{"label": "A", "text": "One complete sentence"}, {"label": "B", "text": "The numeric weight attached to a word during training"}, {"label": "C", "text": "The unit of text the model actually reads and predicts - typically a word piece, not always a whole word"}, {"label": "D", "text": "A single character, always"}], "correct": "C", "explanation": "Text is broken into sub-word pieces by a tokeniser, so a common word may be one token while a rare or compound one is split into several. This is why usage, context limits and pricing are all counted in tokens rather than words."}, {"num": 133, "category": "Programming & CS", "question": "What is the worst-case time complexity of merge sort?", "options": [{"label": "A", "text": "O(n^2)"}, {"label": "B", "text": "O(n log n)"}, {"label": "C", "text": "O(log n)"}, {"label": "D", "text": "O(n)"}], "correct": "B", "explanation": "Merge sort always splits into halves (log n levels) and merges each level in linear time, so its worst case matches its best. Quicksort averages the same but degrades to O(n^2) on a bad pivot choice."}, {"num": 134, "category": "Aptitude", "question": "Find the next term in the series: 5, 11, 23, 47, ?", "options": [{"label": "A", "text": "94"}, {"label": "B", "text": "96"}, {"label": "C", "text": "93"}, {"label": "D", "text": "95"}], "correct": "D", "explanation": "Each term is double the previous one plus 1: 5x2+1 = 11, 11x2+1 = 23, 23x2+1 = 47, and 47x2+1 = 95."}, {"num": 135, "category": "Aptitude", "question": "A factory's output for the week was: Mon 240, Tue 300, Wed 270, Thu 330, Fri 360 units. Wednesday's output is what percentage of the week's total?", "options": [{"label": "A", "text": "18%"}, {"label": "B", "text": "15%"}, {"label": "C", "text": "22.5%"}, {"label": "D", "text": "20%"}], "correct": "A", "explanation": "The week totals 240 + 300 + 270 + 330 + 360 = 1500 units. Wednesday's 270 is 270/1500 = 0.18, which is 18%."}, {"num": 136, "category": "Machine Learning", "question": "Training loss keeps falling while validation loss, having fallen at first, starts rising. What is the right response?", "options": [{"label": "A", "text": "Keep training until the training loss reaches zero"}, {"label": "B", "text": "Increase the model size so it can fit the validation set too"}, {"label": "C", "text": "Stop training at the point where validation loss was lowest - this is early stopping"}, {"label": "D", "text": "Swap the training and validation sets and start again"}], "correct": "C", "explanation": "The crossover is the moment the model stops learning the signal and begins memorising the training set. The weights from the lowest-validation-loss epoch are the ones worth keeping."}, {"num": 137, "category": "Programming & CS", "question": "What is the key difference between a PRIMARY KEY and a UNIQUE constraint?", "options": [{"label": "A", "text": "A unique constraint cannot be used across more than one column"}, {"label": "B", "text": "A primary key is enforced by the application, a unique constraint by the database"}, {"label": "C", "text": "A table has at most one primary key and it cannot contain NULLs; a table may have several unique constraints, and they usually permit a NULL"}, {"label": "D", "text": "There is no difference - PRIMARY KEY is an alias for UNIQUE"}], "correct": "C", "explanation": "Both enforce uniqueness, but the primary key is the table's single chosen identity: one per table, never NULL, and the default target for foreign keys."}, {"num": 138, "category": "Programming & CS", "question": "What is the output?\n\nnums = [3, 1, 2]\nprint(nums.sort())", "options": [{"label": "A", "text": "TypeError"}, {"label": "B", "text": "[3, 1, 2]"}, {"label": "C", "text": "None"}, {"label": "D", "text": "[1, 2, 3]"}], "correct": "C", "explanation": "list.sort() sorts the list in place and returns None. The sorted list is in nums; it is sorted(nums) that returns a new list."}, {"num": 139, "category": "Aptitude", "question": "In a row of 40 students, Rahul is 12th from the left and Priya is 15th from the right. How many students are seated between them?", "options": [{"label": "A", "text": "11"}, {"label": "B", "text": "14"}, {"label": "C", "text": "12"}, {"label": "D", "text": "13"}], "correct": "D", "explanation": "Priya's position from the left is 40 - 15 + 1 = 26. The students strictly between positions 12 and 26 number 26 - 12 - 1 = 13."}, {"num": 140, "category": "Programming & CS", "question": "The Dependency Inversion Principle (the 'D' in SOLID) states that:", "options": [{"label": "A", "text": "Dependencies should always be created inside the class that uses them"}, {"label": "B", "text": "A class should never have more than three dependencies"}, {"label": "C", "text": "High-level modules and low-level modules should both depend on abstractions, not on each other's concrete implementations"}, {"label": "D", "text": "Circular dependencies should be resolved by inverting the call order"}], "correct": "C", "explanation": "Business logic should talk to an interface such as PaymentGateway, with the concrete Stripe or Razorpay class supplied from outside. The details then depend on the abstraction, so swapping one out does not touch the high-level code."}, {"num": 141, "category": "Aptitude", "question": "Which one does not belong with the others: Copper, Iron, Bronze, Zinc?", "options": [{"label": "A", "text": "Copper"}, {"label": "B", "text": "Zinc"}, {"label": "C", "text": "Bronze"}, {"label": "D", "text": "Iron"}], "correct": "C", "explanation": "Copper, iron and zinc are pure metals (elements). Bronze is an alloy, a mixture of copper and tin, so it is the odd one out."}, {"num": 142, "category": "Machine Learning", "question": "A churn model is trained with a feature called cancellation_reason, which is recorded by support staff at the moment a customer cancels. It scores 99% accuracy in testing and fails completely in production. What went wrong?", "options": [{"label": "A", "text": "The model was underfitted"}, {"label": "B", "text": "The learning rate was too high"}, {"label": "C", "text": "The categorical feature should have been one-hot encoded"}, {"label": "D", "text": "Target leakage - the feature is only known after the outcome it is meant to predict"}], "correct": "D", "explanation": "The model learned that a cancellation reason exists means the customer churned, which is true but useless: at prediction time, for a customer who has not cancelled, the field is empty. Any feature that could not have been known before the event has to be dropped."}, {"num": 143, "category": "Programming & CS", "question": "What is the lookup complexity of a hash table?", "options": [{"label": "A", "text": "O(log n) on average"}, {"label": "B", "text": "O(1) always, in every case"}, {"label": "C", "text": "O(n) on average"}, {"label": "D", "text": "O(1) on average, O(n) in the worst case when many keys collide"}], "correct": "D", "explanation": "A good hash spreads keys evenly and a lookup is a single jump. If every key hashes to the same bucket the structure degenerates into a list and the lookup walks all n entries - which is why the quality of the hash function matters."}, {"num": 144, "category": "Aptitude", "question": "1 January 2024 was a Monday. What day of the week was 1 March 2024?", "options": [{"label": "A", "text": "Thursday"}, {"label": "B", "text": "Saturday"}, {"label": "C", "text": "Friday"}, {"label": "D", "text": "Wednesday"}], "correct": "C", "explanation": "2024 is a leap year, so February has 29 days. From 1 January to 1 March is 31 + 29 = 60 days. 60 divided by 7 leaves remainder 4, and four days after Monday is Friday."}, {"num": 145, "category": "Machine Learning", "question": "A dataset is 95% class A and 5% class B. Why use a stratified train/test split?", "options": [{"label": "A", "text": "It sorts the data by class before splitting"}, {"label": "B", "text": "It duplicates the rare class until both classes are equal"}, {"label": "C", "text": "It guarantees a higher accuracy score"}, {"label": "D", "text": "It keeps the same class proportions in both sets, so the rare class is properly represented in each"}], "correct": "D", "explanation": "With a plain random split a small test set can end up with very few - or no - class B rows, making the score meaningless. Stratifying preserves the 95/5 ratio on both sides. Balancing the classes themselves is a separate step, with resampling or class weights."}, {"num": 146, "category": "Programming & CS", "question": "Of WHERE, GROUP BY, HAVING and ORDER BY, which is evaluated last?", "options": [{"label": "A", "text": "WHERE"}, {"label": "B", "text": "ORDER BY"}, {"label": "C", "text": "HAVING"}, {"label": "D", "text": "GROUP BY"}], "correct": "B", "explanation": "The logical order is FROM, WHERE, GROUP BY, HAVING, SELECT, then ORDER BY. Sorting happens on the finished result set, which is also why a SELECT alias can be used in ORDER BY but not in WHERE."}, {"num": 147, "category": "Programming & CS", "question": "A @classmethod that builds and returns a new instance from a different input format, such as User.from_json(...), is commonly called:", "options": [{"label": "A", "text": "An alternative constructor"}, {"label": "B", "text": "A destructor"}, {"label": "C", "text": "An abstract method"}, {"label": "D", "text": "A singleton"}], "correct": "A", "explanation": "The ordinary __init__ is the primary constructor; a classmethod that returns cls(...) from another representation gives the class a second, differently-shaped way to be built - an alternative constructor, also called a factory method."}, {"num": 148, "category": "Aptitude", "question": "Two pens and three books cost Rs. 190. Four pens and one book cost Rs. 180. What does one book cost?", "options": [{"label": "A", "text": "Rs. 35"}, {"label": "B", "text": "Rs. 50"}, {"label": "C", "text": "Rs. 45"}, {"label": "D", "text": "Rs. 40"}], "correct": "D", "explanation": "From 4p + b = 180 we get b = 180 - 4p. Substituting into 2p + 3b = 190 gives 2p + 540 - 12p = 190, so p = 35 and b = 180 - 140 = Rs. 40."}, {"num": 149, "category": "Programming & CS", "question": "What is the time complexity of binary search on a sorted array of n elements?", "options": [{"label": "A", "text": "O(log n)"}, {"label": "B", "text": "O(n log n)"}, {"label": "C", "text": "O(log n)"}, {"label": "D", "text": "O(1)"}], "correct": "A", "explanation": "Each comparison discards half of what is left, so the number of steps is how many times n can be halved - log base 2 of n. The array has to be sorted first for this to hold."}, {"num": 150, "category": "Aptitude", "question": "A is B's brother. C is A's mother. D is C's father. How is B related to D?", "options": [{"label": "A", "text": "Grandchild"}, {"label": "B", "text": "Granddaughter"}, {"label": "C", "text": "Grandson"}, {"label": "D", "text": "Nephew"}], "correct": "A", "explanation": "C is
