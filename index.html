 the mother of both A and B, and D is C's father, so D is B's grandfather and B is D's grandchild. Nothing in the statement fixes B's gender - only A is said to be male - so 'grandson' and 'granddaughter' both overreach."}, {"num": 151, "category": "Machine Learning", "question": "Why run 5-fold cross-validation instead of relying on a single train/test split?", "options": [{"label": "A", "text": "It guarantees the model will not overfit"}, {"label": "B", "text": "Every row is used for validation exactly once, so the score depends far less on which rows happened to land in one lucky split"}, {"label": "C", "text": "It trains the model five times faster"}, {"label": "D", "text": "It removes the need for a test set entirely"}], "correct": "B", "explanation": "A single split can flatter or punish a model by accident, especially on a small dataset. Averaging over five folds gives a more stable estimate, and the spread across folds tells you how sensitive the model is."}, {"num": 152, "category": "Machine Learning", "question": "A training set of 1,000 samples is trained with a batch size of 100 for 5 epochs. How many weight updates does the model make?", "options": [{"label": "A", "text": "5"}, {"label": "B", "text": "50"}, {"label": "C", "text": "5,000"}, {"label": "D", "text": "500"}], "correct": "B", "explanation": "Each epoch is one pass over the data, which at 100 samples per batch is 1000/100 = 10 batches, and each batch produces one update. Over 5 epochs that is 10 x 5 = 50 updates."}, {"num": 153, "category": "Machine Learning", "question": "Why keep a validation set separate from the test set?", "options": [{"label": "A", "text": "The test set is for classification and the validation set for regression"}, {"label": "B", "text": "Two sets are needed only when the dataset is very large"}, {"label": "C", "text": "The validation set is used to train the model and the test set to fit the scaler"}, {"label": "D", "text": "Hyperparameters are chosen using the validation set, so the untouched test set can still give an unbiased final estimate"}], "correct": "D", "explanation": "Every time you tune against a set you learn something about it, so its score stops being an honest estimate. Holding the test set back until the very end is what keeps the final number meaningful."}, {"num": 154, "category": "Programming & CS", "question": "Why is isinstance(obj, Base) usually preferred to type(obj) is Base?", "options": [{"label": "A", "text": "isinstance works on None while type() raises an error"}, {"label": "B", "text": "isinstance also accepts instances of subclasses, which is what substitutability requires"}, {"label": "C", "text": "type() cannot be used on user-defined classes"}, {"label": "D", "text": "isinstance runs faster on large objects"}], "correct": "B", "explanation": "type(obj) is Base is an exact identity check and rejects a perfectly valid subclass instance. isinstance honours the inheritance hierarchy, so code written against Base keeps working for anything derived from it."}, {"num": 155, "category": "Machine Learning", "question": "A spam filter flags 100 emails as spam and 80 of them really are spam. Which metric is 80/100?", "options": [{"label": "A", "text": "Precision"}, {"label": "B", "text": "Accuracy"}, {"label": "C", "text": "Recall"}, {"label": "D", "text": "F1 score"}], "correct": "A", "explanation": "Precision asks: of everything the model flagged, how much was right? Recall asks the other question - of all the real spam that existed, how much did the model catch?"}, {"num": 156, "category": "Programming & CS", "question": "What is the output?\n\na, *b = [1, 2, 3, 4]\nprint(b)", "options": [{"label": "A", "text": "[2, 3, 4]"}, {"label": "B", "text": "4"}, {"label": "C", "text": "(2, 3, 4)"}, {"label": "D", "text": "[1, 2, 3]"}], "correct": "A", "explanation": "Starred unpacking gives a the first value and collects everything that remains into b as a list, so b is [2, 3, 4]."}, {"num": 157, "category": "Programming & CS", "question": "What is the output?\n\nclass P:\n    def __repr__(self):\n        return \"P!\"\n\nprint(P())", "options": [{"label": "A", "text": "<__main__.P object>"}, {"label": "B", "text": "AttributeError: no __str__ defined"}, {"label": "C", "text": "None"}, {"label": "D", "text": "P!"}], "correct": "D", "explanation": "print looks for __str__, and the default __str__ falls back to __repr__. Defining only __repr__ therefore covers both - which is why __repr__ is the one to implement first."}, {"num": 158, "category": "Machine Learning", "question": "Which statement about L1 (Lasso) and L2 (Ridge) regularisation is correct?", "options": [{"label": "A", "text": "Both drive coefficients to exactly zero, differing only in speed"}, {"label": "B", "text": "Neither affects the coefficients - they only change the learning rate"}, {"label": "C", "text": "L1 can shrink coefficients to exactly zero, effectively selecting features; L2 shrinks them towards zero but rarely to zero"}, {"label": "D", "text": "L2 can shrink coefficients to exactly zero; L1 cannot"}], "correct": "C", "explanation": "The L1 penalty's shape makes zero a genuine optimum, so unhelpful features drop out of the model altogether. L2 pulls every coefficient down smoothly and keeps them all, which is why it is the safer default when all the features matter."}, {"num": 159, "category": "Aptitude", "question": "Three unbiased coins are tossed together. What is the probability of getting at least two heads?", "options": [{"label": "A", "text": "3/8"}, {"label": "B", "text": "1/2"}, {"label": "C", "text": "1/4"}, {"label": "D", "text": "5/8"}], "correct": "B", "explanation": "There are 8 equally likely outcomes. Four of them have two or more heads: HHH, HHT, HTH, THH. So the probability is 4/8 = 1/2."}, {"num": 160, "category": "Programming & CS", "question": "What is the difference between a compiler and an interpreter?", "options": [{"label": "A", "text": "A compiler translates the whole program into machine code ahead of time; an interpreter reads and executes it statement by statement at run time"}, {"label": "B", "text": "A compiler works on scripting languages and an interpreter on system languages"}, {"label": "C", "text": "An interpreter is always faster because it skips the translation step"}, {"label": "D", "text": "A compiler runs the program and an interpreter only checks it for errors"}], "correct": "A", "explanation": "Compiled programs pay their translation cost once and run fast afterwards; interpreted ones start immediately but do the work on every run. Python sits in between - it compiles to bytecode, which its virtual machine then interprets."}, {"num": 161, "category": "Trainee Interview (Python, Math & ML)", "question": "Statements: All engineers in the team know Python. Some people who know Python also know SQL.\n\nWhich conclusion definitely follows?", "options": [{"label": "A", "text": "It cannot be determined whether any engineer knows SQL"}, {"label": "B", "text": "Some engineers in the team definitely know SQL"}, {"label": "C", "text": "No engineer in the team knows SQL"}, {"label": "D", "text": "Every engineer in the team knows SQL"}], "correct": "A", "explanation": "The engineers sit inside the group of Python users, but the people who also know SQL could be entirely outside that inner group. Nothing forces an overlap either way, so no definite conclusion about engineers and SQL can be drawn."}, {"num": 162, "category": "Trainee Interview (Python, Math & ML)", "question": "A multiple linear regression learned: score = (3 x hours) + (2 x attendance) + 10. What does it predict for a student with 5 hours and an attendance value of 20?", "options": [{"label": "A", "text": "75"}, {"label": "B", "text": "55"}, {"label": "C", "text": "65"}, {"label": "D", "text": "45"}], "correct": "C", "explanation": "Each feature is multiplied by its own learned weight and the results are added along with the intercept: (3 x 5) + (2 x 20) + 10 = 15 + 40 + 10 = 65."}, {"num": 163, "category": "Trainee Interview (Python, Math & ML)", "question": "An array is built with np.arange(1, 13). Which reshape is NOT valid for it?", "options": [{"label": "A", "text": "reshape(5, 2)"}, {"label": "B", "text": "reshape(3, 4)"}, {"label": "C", "text": "reshape(4, 3)"}, {"label": "D", "text": "reshape(2, 6)"}], "correct": "A", "explanation": "np.arange(1, 13) holds 12 values, stopping before 13. A reshape must account for every value, and 5 x 2 is 10, so it fails. The other three all multiply to 12."}, {"num": 164, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\ntotal = 0\nfor i in range(2, 11, 3):\n    total += i\nprint(total)", "options": [{"label": "A", "text": "26"}, {"label": "B", "text": "15"}, {"label": "C", "text": "12"}, {"label": "D", "text": "18"}], "correct": "B", "explanation": "range(2, 11, 3) starts at 2 and steps by 3 while staying below 11, giving 2, 5 and 8. Their sum is 15."}, {"num": 165, "category": "Trainee Interview (Python, Math & ML)", "question": "Matrix A has 2 rows and 5 columns. What is the shape of A transpose?", "options": [{"label": "A", "text": "2 rows by 2 columns"}, {"label": "B", "text": "5 rows by 2 columns"}, {"label": "C", "text": "5 rows by 5 columns"}, {"label": "D", "text": "2 rows by 5 columns"}], "correct": "B", "explanation": "The transpose flips the matrix over its diagonal: every row becomes a column and every column becomes a row, so the shape flips from 2 by 5 to 5 by 2."}, {"num": 166, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\ndef add(a, b):\n    a + b\n\nresult = add(2, 3)\nprint(result)", "options": [{"label": "A", "text": "5"}, {"label": "B", "text": "None"}, {"label": "C", "text": "It raises a TypeError"}, {"label": "D", "text": "0"}], "correct": "B", "explanation": "The function computes a + b but never returns it. A function with no return hands back None by default, so that is what gets printed."}, {"num": 167, "category": "Trainee Interview (Python, Math & ML)", "question": "A logistic regression model outputs a probability of 0.48 for a student passing, and the default threshold is used. What does it predict?", "options": [{"label": "A", "text": "It cannot make a decision from that probability"}, {"label": "B", "text": "Pass, because 0.48 is close enough to 0.5"}, {"label": "C", "text": "Fail, because 0.48 is below the 0.5 decision boundary"}, {"label": "D", "text": "Pass, because thresholds apply only to linear regression"}], "correct": "C", "explanation": "A probability on its own is not a decision. Logistic regression applies a threshold, by default 0.5, to turn it into a category — and 0.48 falls just below it. The threshold can be moved when one kind of mistake matters more than the other."}, {"num": 168, "category": "Trainee Interview (Python, Math & ML)", "question": "A classifier made 42 correct predictions out of 50 test samples. What is its accuracy?", "options": [{"label": "A", "text": "84%"}, {"label": "B", "text": "58%"}, {"label": "C", "text": "8%"}, {"label": "D", "text": "42%"}], "correct": "A", "explanation": "Accuracy is simply the share of predictions the model got right: 42 / 50 = 0.84, or 84%. A confusion matrix would then show which categories the remaining 8 mistakes fell into, which a single accuracy number hides."}, {"num": 169, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\ntag = \"AI\"\nprint(tag * 2 + \"ML\")", "options": [{"label": "A", "text": "AIAIML"}, {"label": "B", "text": "AIMLAIML"}, {"label": "C", "text": "AI2ML"}, {"label": "D", "text": "It raises a TypeError"}], "correct": "A", "explanation": "Multiplying a string repeats it, so tag * 2 is AIAI. The + then joins ML onto the end, giving AIAIML."}, {"num": 170, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nimport pandas as pd\n\ndf = pd.DataFrame({\"score\": [45, 72, 88, 39, 60]})\nprint(len(df[df[\"score\"] >= 60]))", "options": [{"label": "A", "text": "4"}, {"label": "B", "text": "5"}, {"label": "C", "text": "2"}, {"label": "D", "text": "3"}], "correct": "D", "explanation": "The condition produces True or False for each row, and only the True rows survive the filter. Scores 72, 88 and 60 all meet the cutoff — 60 included, because the test is >= — so three rows remain."}, {"num": 171, "category": "Trainee Interview (Python, Math & ML)", "question": "A DataFrame df has columns name and score. Which of these returns a DataFrame rather than a Series?", "options": [{"label": "A", "text": "df[[\"score\"]]"}, {"label": "B", "text": "df.score"}, {"label": "C", "text": "df.loc[0, \"score\"]"}, {"label": "D", "text": "df[\"score\"]"}], "correct": "A", "explanation": "A single column name in square brackets returns one labelled column, which is a Series. Wrapping the name in a list asks for a set of columns, so Pandas returns a DataFrame — even when that set holds just one."}, {"num": 172, "category": "Trainee Interview (Python, Math & ML)", "question": "A decision tree scores 100% accuracy on its training data but only 61% on the test set. What most likely happened?", "options": [{"label": "A", "text": "The tree overfit, memorising the training data instead of learning a general pattern"}, {"label": "B", "text": "The tree underfit and needs to grow deeper"}, {"label": "C", "text": "The model needs more input features"}, {"label": "D", "text": "The test set must be too small to trust"}], "correct": "A", "explanation": "Left unchecked, a tree keeps splitting until each training example sits in its own leaf, which is perfect memory rather than a learned pattern. It then performs badly on data it has never seen. Limiting the tree's depth is the simplest fix."}, {"num": 173, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nscore = 90\nif score > 90:\n    print(\"A\")\nelif score >= 75:\n    print(\"B\")\nelif score >= 60:\n    print(\"C\")\nelse:\n    print(\"D\")", "options": [{"label": "A", "text": "D"}, {"label": "B", "text": "B"}, {"label": "C", "text": "A"}, {"label": "D", "text": "C"}], "correct": "B", "explanation": "The first test is > 90, and 90 is not greater than 90, so it fails. The next test, >= 75, is true, so B prints and the rest of the chain is skipped."}, {"num": 174, "category": "Trainee Interview (Python, Math & ML)", "question": "What happens when this code runs?\n\ndef set_age(age):\n    if age < 0:\n        raise ValueError(\"Age cannot be negative\")\n    return age\n\nprint(set_age(-5))", "options": [{"label": "A", "text": "It prints 0"}, {"label": "B", "text": "It raises a ValueError and nothing is printed"}, {"label": "C", "text": "It prints -5"}, {"label": "D", "text": "It prints None"}], "correct": "B", "explanation": "raise stops the function at that line and throws the error immediately, so return is never reached and print never receives a value. Whoever calls the function would wrap it in try/except to react."}, {"num": 175, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\ntry:\n    num = int(\"abc\")\nexcept ZeroDivisionError:\n    print(\"Divide error\")\nexcept ValueError:\n    print(\"Value error\")", "options": [{"label": "A", "text": "Nothing, the program crashes"}, {"label": "B", "text": "Both lines, in order"}, {"label": "C", "text": "Divide error"}, {"label": "D", "text": "Value error"}], "correct": "D", "explanation": "int(\"abc\") raises a ValueError. Python checks each except from top to bottom and runs only the first one whose type matches, so the ZeroDivisionError block is skipped entirely."}, {"num": 176, "category": "Trainee Interview (Python, Math & ML)", "question": "You need to predict how many units of electricity a factory will consume tomorrow. Which model type fits the problem?", "options": [{"label": "A", "text": "Linear regression, because the answer is a number"}, {"label": "B", "text": "K-Means, because it finds patterns in the data"}, {"label": "C", "text": "A decision tree classifier, because it handles any prediction"}, {"label": "D", "text": "Logistic regression, because it is a prediction"}], "correct": "A", "explanation": "The quantity being predicted is a continuous number, which is regression. Logistic regression and classifiers predict which category something falls into, and K-Means does not predict a target at all."}, {"num": 177, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nprofile = {\"city\": \"Salem\", \"batch\": 136}\nprofile[\"city\"] = \"Chennai\"\nprofile[\"course\"] = \"AI & ML\"\nprint(len(profile))", "options": [{"label": "A", "text": "It raises a KeyError"}, {"label": "B", "text": "2"}, {"label": "C", "text": "4"}, {"label": "D", "text": "3"}], "correct": "D", "explanation": "Assigning to an existing key updates it, so city does not add an entry. Assigning to a key that does not exist creates it, so only course is new — 2 keys become 3."}, {"num": 178, "category": "Trainee Interview (Python, Math & ML)", "question": "Which of these is a valid Python variable name?", "options": [{"label": "A", "text": "class"}, {"label": "B", "text": "student-name"}, {"label": "C", "text": "_total2"}, {"label": "D", "text": "2nd_score"}], "correct": "C", "explanation": "A name may start with a letter or an underscore and contain only letters, digits and underscores. 2nd_score starts with a digit, student-name contains a hyphen, and class is a reserved keyword."}, {"num": 179, "category": "Trainee Interview (Python, Math & ML)", "question": "The chance of rain on any given day is 0.4, and the two days are independent. What is the probability that it does not rain on either of two days?", "options": [{"label": "A", "text": "0.16"}, {"label": "B", "text": "0.36"}, {"label": "C", "text": "0.60"}, {"label": "D", "text": "0.80"}], "correct": "B", "explanation": "By the complement rule, the chance of no rain on one day is 1 - 0.4 = 0.6. For two independent events both happening, the AND rule multiplies: 0.6 x 0.6 = 0.36."}, {"num": 180, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nsubjects = [\"Math\", \"Physics\", \"Python\", \"Stats\", \"ML\"]\nprint(subjects[-2], subjects[1:3])", "options": [{"label": "A", "text": "Stats ['Physics', 'Python']"}, {"label": "B", "text": "Python ['Physics', 'Python', 'Stats']"}, {"label": "C", "text": "Stats ['Math', 'Physics']"}, {"label": "D", "text": "ML ['Physics', 'Python']"}], "correct": "A", "explanation": "-2 counts backwards from the end, so it is Stats. A slice stops just before its end index, so [1:3] takes positions 1 and 2 only: Physics and Python."}, {"num": 181, "category": "Trainee Interview (Python, Math & ML)", "question": "What happens when this code runs?\n\ndob = (17, 8, 2008)\ndob[0] = 18", "options": [{"label": "A", "text": "It raises a TypeError"}, {"label": "B", "text": "It raises an IndexError"}, {"label": "C", "text": "It raises a ValueError"}, {"label": "D", "text": "It works and dob becomes (18, 8, 2008)"}], "correct": "A", "explanation": "A tuple is immutable — once created, its items cannot be reassigned. Attempting it raises a TypeError saying the tuple does not support item assignment."}, {"num": 182, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nimport pandas as pd\n\ndf = pd.DataFrame({\"score\": [70, None, 85, None, 60]})\nprint(df[\"score\"].isna().sum())", "options": [{"label": "A", "text": "2"}, {"label": "B", "text": "1"}, {"label": "C", "text": "3"}, {"label": "D", "text": "0"}], "correct": "A", "explanation": "isna() returns True wherever a value is missing and False everywhere else. Summing those treats True as 1, so the result is a straight count of missing values — here, 2."}, {"num": 183, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nwith open(\"log.txt\", \"w\") as f:\n    f.write(\"Saved!\")\nprint(f.closed)", "options": [{"label": "A", "text": "False"}, {"label": "B", "text": "It raises a ValueError"}, {"label": "C", "text": "None"}, {"label": "D", "text": "True"}], "correct": "D", "explanation": "A with block closes the file automatically the moment it ends, even if an error happened inside. By the time print runs, the file is already closed, so f.closed is True."}, {"num": 184, "category": "Trainee Interview (Python, Math & ML)", "question": "What happens when this code runs?\n\nmarks = 82\nif marks >= 50:\nprint(\"Passed\")", "options": [{"label": "A", "text": "It raises an IndentationError before anything runs"}, {"label": "B", "text": "It prints Passed twice"}, {"label": "C", "text": "It prints nothing but does not error"}, {"label": "D", "text": "It prints Passed"}], "correct": "A", "explanation": "Python uses indentation to mark which lines belong inside a block. The body of the if is not indented, so Python cannot tell what belongs to it and raises an IndentationError."}, {"num": 185, "category": "Trainee Interview (Python, Math & ML)", "question": "A trained linear regression model learned a slope of 7 and an intercept of 35. What does it predict when the input is 6?", "options": [{"label": "A", "text": "42"}, {"label": "B", "text": "48"}, {"label": "C", "text": "77"}, {"label": "D", "text": "35"}], "correct": "C", "explanation": "Prediction is just the line equation with the learned numbers plugged in: y = (7 x 6) + 35 = 42 + 35 = 77. This is exactly what predict() does internally."}, {"num": 186, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nf = open(\"log.txt\", \"w\")\nf.write(\"First\")\nf.close()\n\nf = open(\"log.txt\", \"w\")\nf.write(\"Second\")\nf.close()\n\nprint(open(\"log.txt\").read())", "options": [{"label": "A", "text": "Second"}, {"label": "B", "text": "FirstSecond"}, {"label": "C", "text": "First"}, {"label": "D", "text": "Nothing, the file is empty"}], "correct": "A", "explanation": "Mode \"w\" wipes the file clean every time it is opened, even if you already wrote to it. The second open erases First before Second is written, so only Second survives."}, {"num": 187, "category": "Trainee Interview (Python, Math & ML)", "question": "Two vectors are a = [2, 3, 4] and b = [1, 5, 2]. What is their dot product?", "options": [{"label": "A", "text": "24"}, {"label": "B", "text": "30"}, {"label": "C", "text": "25"}, {"label": "D", "text": "19"}], "correct": "C", "explanation": "The dot product multiplies matching positions and adds the results: (2x1) + (3x5) + (4x2) = 2 + 15 + 8 = 25. The answer is always a single number, never another vector."}, {"num": 188, "category": "Trainee Interview (Python, Math & ML)", "question": "What do these two lines print?\n\nimport numpy as np\n\npy = [1, 2, 3]\narr = np.array([1, 2, 3])\nprint(py * 2)\nprint(arr * 2)", "options": [{"label": "A", "text": "[2, 4, 6] then [2 4 6]"}, {"label": "B", "text": "[1, 2, 3, 1, 2, 3] then [1 2 3 1 2 3]"}, {"label": "C", "text": "[1, 2, 3, 1, 2, 3] then [2 4 6]"}, {"label": "D", "text": "[2, 4, 6] then [1 2 3 1 2 3]"}], "correct": "C", "explanation": "Multiplying a Python list repeats it, so the list is duplicated end to end. A NumPy array does the maths element by element instead, doubling every value. This difference is the whole reason NumPy exists."}, {"num": 189, "category": "Trainee Interview (Python, Math & ML)", "question": "You want to know how many rows fall into each category of a class column. Which call does that directly?", "options": [{"label": "A", "text": "df[\"class\"].value_counts()"}, {"label": "B", "text": "df.corr()"}, {"label": "C", "text": "df.describe()"}, {"label": "D", "text": "df.groupby(\"class\")[\"score\"].mean()"}], "correct": "A", "explanation": "value_counts() counts how many times each unique value appears in a column. groupby is for calculating something per group, such as the average score in each class — a different question."}, {"num": 190, "category": "Trainee Interview (Python, Math & ML)", "question": "In a batch of 50 students, 32 attended the Python lab and 26 attended the ML lab. Every student attended at least one of the two. How many attended both?", "options": [{"label": "A", "text": "18"}, {"label": "B", "text": "6"}, {"label": "C", "text": "8"}, {"label": "D", "text": "12"}], "correct": "C", "explanation": "Adding the two counts gives 58, which is 8 more than the 50 students who exist. That excess is exactly the group counted twice, so 8 students attended both labs."}, {"num": 191, "category": "Trainee Interview (Python, Math & ML)", "question": "A feature has a mean of 60 and a standard deviation of 10. What is the standardized value of an observation of 80?", "options": [{"label": "A", "text": "0.5"}, {"label": "B", "text": "8"}, {"label": "C", "text": "2"}, {"label": "D", "text": "20"}], "correct": "C", "explanation": "Standardization is (value - mean) / standard deviation, so (80 - 60) / 10 = 2. The observation sits two standard deviations above the mean, and every feature rescaled this way becomes comparable."}, {"num": 192, "category": "Trainee Interview (Python, Math & ML)", "question": "Three boxes are labelled Python, ML and Mixed, and every label is known to be wrong. The box labelled Mixed is opened and contains only Python books. What is inside the box labelled ML?", "options": [{"label": "A", "text": "ML books only"}, {"label": "B", "text": "Mixed books"}, {"label": "C", "text": "It cannot be determined"}, {"label": "D", "text": "Python books only"}], "correct": "B", "explanation": "The box labelled Mixed holds Python, so Python is accounted for. The box labelled ML cannot hold ML because its label is wrong, and Python is taken, so it must hold Mixed. That leaves ML for the box labelled Python."}, {"num": 193, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nprint(17 // 5 + 17 % 5)", "options": [{"label": "A", "text": "6"}, {"label": "B", "text": "2"}, {"label": "C", "text": "5"}, {"label": "D", "text": "3"}], "correct": "C", "explanation": "// is floor division: 17 // 5 is 3. % is the remainder: 17 % 5 is 2. Adding them gives 5."}, {"num": 194, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\ndef order(size=\"Regular\", sugar=1):\n    print(size, sugar)\n\norder(sugar=2)", "options": [{"label": "A", "text": "2 1"}, {"label": "B", "text": "It raises a TypeError"}, {"label": "C", "text": "Regular 2"}, {"label": "D", "text": "Regular 1"}], "correct": "C", "explanation": "Naming the argument lets you set sugar while skipping size entirely. size falls back to its default, Regular, and sugar takes the value passed, 2."}, {"num": 195, "category": "Trainee Interview (Python, Math & ML)", "question": "The user types 20 when this runs. What happens?\n\nage = input(\"Age: \")\nprint(age + 5)", "options": [{"label": "A", "text": "It prints 205"}, {"label": "B", "text": "It prints 25"}, {"label": "C", "text": "It raises a TypeError"}, {"label": "D", "text": "It raises a ValueError"}], "correct": "C", "explanation": "input() always returns a string, so age holds the text \"20\", not the number 20. Adding an integer to a string raises a TypeError. int(age) + 5 is the fix."}, {"num": 196, "category": "Trainee Interview (Python, Math & ML)", "question": "Out of 200 emails, 50 contain the word 'offer'. Of those 50, 35 are spam. What is the probability that an email is spam, given that it contains 'offer'?", "options": [{"label": "A", "text": "0.35"}, {"label": "B", "text": "0.25"}, {"label": "C", "text": "0.175"}, {"label": "D", "text": "0.70"}], "correct": "D", "explanation": "Conditional probability narrows the world to only the cases where the condition already holds. Of the 50 emails containing 'offer', 35 are spam, so the answer is 35/50 = 0.70. The 200 is not used."}, {"num": 197, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nstudent = {\"name\": \"Kavya\", \"age\": 17}\nprint(student.get(\"email\"))\nprint(student[\"email\"])", "options": [{"label": "A", "text": "An empty string, then None"}, {"label": "B", "text": "A KeyError straight away"}, {"label": "C", "text": "None, then a KeyError is raised"}, {"label": "D", "text": "None, then None"}], "correct": "C", "explanation": "get returns None for a missing key instead of failing. Square-bracket access has no such safety net, so the second line raises a KeyError."}, {"num": 198, "category": "Trainee Interview (Python, Math & ML)", "question": "Five exam scores are 40, 45, 50, 55 and 210. Which statement is correct?", "options": [{"label": "A", "text": "The mean and the median are both 80"}, {"label": "B", "text": "The mean is 50 and the median is 80"}, {"label": "C", "text": "The mean and the median are both 50"}, {"label": "D", "text": "The mean is 80 and the median is 50, so the one extreme score pulled the mean well above the median"}], "correct": "D", "explanation": "The mean is 400/5 = 80. The median is the middle value once sorted, which is 50. A single very large value drags the mean upward but barely moves the median — which is exactly why both are worth reporting."}, {"num": 199, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nnums = [10, 20, 30, 40]\nnums.remove(30)\nnums.pop(0)\nprint(nums)", "options": [{"label": "A", "text": "[20, 40]"}, {"label": "B", "text": "[10, 40]"}, {"label": "C", "text": "[20, 30]"}, {"label": "D", "text": "[10, 20]"}], "correct": "A", "explanation": "remove(30) deletes by value, leaving [10, 20, 40]. pop(0) deletes by position, removing the first item, 10, and leaving [20, 40]."}, {"num": 200, "category": "Trainee Interview (Python, Math & ML)", "question": "What does a support vector machine specifically try to maximise when it draws a boundary between two classes?", "options": [{"label": "A", "text": "The margin — the gap between the boundary and the closest points of each class"}, {"label": "B", "text": "The depth of the decision boundary"}, {"label": "C", "text": "The number of training examples it fits exactly"}, {"label": "D", "text": "The number of features it uses"}], "correct": "A", "explanation": "Many boundaries could separate two classes. An SVM picks the one with the widest possible gap on either side, like the widest street that could be drawn between two neighbourhoods, because that extra room is what makes it hold up on new data."}, {"num": 201, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nitems = [\"Milk\", \"Bread\"]\nitems.append(\"Eggs\")\nitems.insert(1, \"Rice\")\nprint(items)", "options": [{"label": "A", "text": "['Rice', 'Milk', 'Bread', 'Eggs']"}, {"label": "B", "text": "['Milk', 'Rice', 'Eggs', 'Bread']"}, {"label": "C", "text": "['Milk', 'Bread', 'Eggs', 'Rice']"}, {"label": "D", "text": "['Milk', 'Rice', 'Bread', 'Eggs']"}], "correct": "D", "explanation": "append adds Eggs at the end, giving Milk, Bread, Eggs. insert(1, \"Rice\") then puts Rice at position 1 and pushes everything after it one place along."}, {"num": 202, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\ncount = 5\nwhile count > 0:\n    count -= 2\nprint(count)", "options": [{"label": "A", "text": "0"}, {"label": "B", "text": "It loops forever"}, {"label": "C", "text": "-1"}, {"label": "D", "text": "1"}], "correct": "C", "explanation": "count goes 5 → 3 → 1 → -1. When count is 1 the condition is still true, so the body runs once more and count becomes -1, which finally ends the loop."}, {"num": 203, "category": "Trainee Interview (Python, Math & ML)", "question": "A price column loaded from a CSV is stored as text because one row contained the word 'unknown'. After that row is cleaned up, which call makes the column usable for arithmetic?", "options": [{"label": "A", "text": "df[\"price\"].astype(float)"}, {"label": "B", "text": "df[\"price\"].mean()"}, {"label": "C", "text": "df.dropna()"}, {"label": "D", "text": "df[\"price\"].value_counts()"}], "correct": "A", "explanation": "A column stored as text will not do maths, even when every entry now looks like a number. astype converts it to a numeric type, and it raises an error if any value still cannot be converted — which is often how a remaining problem gets caught."}, {"num": 204, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\narjun = {\"Action\", \"Comedy\"}\npriya = {\"Comedy\", \"Drama\"}\nprint(len(arjun | priya), len(arjun & priya))", "options": [{"label": "A", "text": "3 2"}, {"label": "B", "text": "3 1"}, {"label": "C", "text": "4 1"}, {"label": "D", "text": "2 1"}], "correct": "B", "explanation": "| is union, everything either set contains: Action, Comedy, Drama — 3 items, with the shared Comedy stored once. & is intersection, only what both contain: Comedy alone, so 1."}, {"num": 205, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nline = \"Pen,10,Stationery\\n\"\nparts = line.strip().split(\",\")\nprint(len(parts), parts[1])", "options": [{"label": "A", "text": "2 10"}, {"label": "B", "text": "3 Pen"}, {"label": "C", "text": "3 10"}, {"label": "D", "text": "4 10"}], "correct": "C", "explanation": "strip() removes the trailing newline, then split(\",\") breaks the line at each comma into three pieces: Pen, 10 and Stationery. Position 1 is the second piece, 10 — still a string, not a number."}, {"num": 206, "category": "Trainee Interview (Python, Math & ML)", "question": "Matrix A is 3 rows by 2 columns. Matrix B is 2 rows by 4 columns. What is true of A multiplied by B?", "options": [{"label": "A", "text": "It is invalid, the sizes do not allow it"}, {"label": "B", "text": "It is valid, and the result is 3 by 4"}, {"label": "C", "text": "It is valid, and the result is 2 by 2"}, {"label": "D", "text": "It is valid, and the result is 4 by 3"}], "correct": "B", "explanation": "Multiplication works only when the columns of A match the rows of B — here both are 2, so it is valid. The result takes the row count of A and the column count of B, giving 3 by 4."}, {"num": 207, "category": "Trainee Interview (Python, Math & ML)", "question": "A dataset is 2, 4, 4, 4, 5, 5, 7, 9, and its mean is 5. What is its standard deviation?", "options": [{"label": "A", "text": "16"}, {"label": "B", "text": "4"}, {"label": "C", "text": "1.41"}, {"label": "D", "text": "2"}], "correct": "D", "explanation": "The squared distances from the mean are 9, 1, 1, 1, 0, 0, 4 and 16, which total 32. Variance is 32/8 = 4, and the standard deviation is the square root of the variance, so 2."}, {"num": 208, "category": "Trainee Interview (Python, Math & ML)", "question": "A model predicted 54 where the real value was 50, and 57 where the real value was 60. What is the Mean Squared Error of these two predictions?", "options": [{"label": "A", "text": "0.5"}, {"label": "B", "text": "25"}, {"label": "C", "text": "12.5"}, {"label": "D", "text": "3.5"}], "correct": "C", "explanation": "The errors are 4 and -3. Squaring removes the signs so they cannot cancel: 16 and 9. The mean of those is (16 + 9) / 2 = 12.5. Training a model means searching for the line that makes this number as small as possible."}, {"num": 209, "category": "Trainee Interview (Python, Math & ML)", "question": "In a test, R scored more than S. Q scored less than S. P scored more than R but less than T. Who scored the highest, and who the lowest?", "options": [{"label": "A", "text": "P highest, S lowest"}, {"label": "B", "text": "T highest, S lowest"}, {"label": "C", "text": "R highest, Q lowest"}, {"label": "D", "text": "T highest, Q lowest"}], "correct": "D", "explanation": "Chaining the comparisons gives T > P > R > S > Q. T sits at the top and Q at the bottom."}, {"num": 210, "category": "Trainee Interview (Python, Math & ML)", "question": "Which one does not belong with the others?", "options": [{"label": "A", "text": "Litre"}, {"label": "B", "text": "Temperature"}, {"label": "C", "text": "Kilogram"}, {"label": "D", "text": "Metre"}], "correct": "B", "explanation": "Kilogram, litre and metre are units of measurement. Temperature is the quantity being measured, not a unit, so it is the odd one out."}, {"num": 211, "category": "Trainee Interview (Python, Math & ML)", "question": "The correlation between hours spent on social media and exam score is -0.85. What does this tell you?", "options": [{"label": "A", "text": "A strong relationship in which, as one rises, the other tends to fall"}, {"label": "B", "text": "A weak relationship, because the value is negative"}, {"label": "C", "text": "Nothing, because correlation cannot be negative"}, {"label": "D", "text": "That social media use causes lower exam scores"}], "correct": "A", "explanation": "Correlation runs from -1 to +1. A value near -0.85 is strong, and the minus sign means the two move in opposite directions. Strength and direction are all it reports — it never establishes cause."}, {"num": 212, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print, and in what order?\n\ntry:\n    print(5 / 0)\nexcept ZeroDivisionError:\n    print(\"Caught it\")\nfinally:\n    print(\"Cleanup done\")", "options": [{"label": "A", "text": "Only Cleanup done"}, {"label": "B", "text": "Only Caught it"}, {"label": "C", "text": "Cleanup done, then Caught it"}, {"label": "D", "text": "Caught it, then Cleanup done"}], "correct": "D", "explanation": "The division fails, so the except block runs and prints Caught it. A finally block always runs last, whether the try succeeded, failed, or was caught, so Cleanup done follows."}, {"num": 213, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nimport numpy as np\n\na = np.array([3, 6, 9, 12])\nprint(a[1:3] + 10)", "options": [{"label": "A", "text": "[16 19 22]"}, {"label": "B", "text": "[13 16 19 22]"}, {"label": "C", "text": "[13 16 19]"}, {"label": "D", "text": "[16 19]"}], "correct": "D", "explanation": "The slice [1:3] takes positions 1 and 2 only — 6 and 9 — because a slice stops before its end index. Broadcasting then adds 10 to each, giving 16 and 19."}, {"num": 214, "category": "Trainee Interview (Python, Math & ML)", "question": "Which of these pairings of a mistake with the error it raises is correct?", "options": [{"label": "A", "text": "Dividing a number by zero raises a ValueError"}, {"label": "B", "text": "Opening a file that does not exist raises a FileNotFoundError"}, {"label": "C", "text": "Looking up a missing dictionary key raises an IndexError"}, {"label": "D", "text": "Calling int(\"abc\") raises a ZeroDivisionError"}], "correct": "B", "explanation": "A missing dictionary key raises KeyError, int(\"abc\") raises ValueError, and dividing by zero raises ZeroDivisionError. Only the file pairing is correct."}, {"num": 215, "category": "Trainee Interview (Python, Math & ML)", "question": "You compare two models and the test returns a p-value of 0.03. What is the correct reading?", "options": [{"label": "A", "text": "There is a 3% chance the two models are identical"}, {"label": "B", "text": "The result is almost certainly just random chance"}, {"label": "C", "text": "Model B performs 3% better than model A"}, {"label": "D", "text": "A difference this large would be unlikely, about 3% likely, if there were really no difference at all — usually called statistically significant"}], "correct": "D", "explanation": "A p-value measures how surprising your result would be if the null hypothesis — no real difference — were true. At 0.03 it is below the usual 0.05 threshold, so the difference is treated as real rather than noise."}, {"num": 216, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nname = \"Kavya\"\nmarks = 91\nprint(f\"{name} scored {marks + 4}\")", "options": [{"label": "A", "text": "Kavya scored 91 + 4"}, {"label": "B", "text": "Kavya scored 95"}, {"label": "C", "text": "Kavya scored 914"}, {"label": "D", "text": "{name} scored 95"}], "correct": "B", "explanation": "An f-string evaluates whatever sits inside the braces and drops the result into the text, so {marks + 4} becomes 95."}, {"num": 217, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nclass Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        print(self.name, \"says Woof!\")\n\nd1 = Dog(\"Rocky\")\nd2 = Dog(\"Bruno\")\nd2.bark()", "options": [{"label": "A", "text": "It raises a TypeError"}, {"label": "B", "text": "Rocky says Woof!"}, {"label": "C", "text": "name says Woof!"}, {"label": "D", "text": "Bruno says Woof!"}], "correct": "D", "explanation": "Each object keeps its own attributes. d2 was built with \"Bruno\", so inside d2.bark() the value of self.name is Bruno. Creating d1 first changes nothing about d2."}, {"num": 218, "category": "Trainee Interview (Python, Math & ML)", "question": "Which statement about the sigmoid function is correct?", "options": [{"label": "A", "text": "It outputs only 0 or 1, never anything in between"}, {"label": "B", "text": "It outputs a value between -1 and 1"}, {"label": "C", "text": "It outputs any number, positive or negative"}, {"label": "D", "text": "It always outputs a value between 0 and 1, and sigmoid(0) is exactly 0.5"}], "correct": "D", "explanation": "Sigmoid squashes any input, however large or small, into the range 0 to 1 so the output can be read as a probability. Large positive inputs approach 1, large negative inputs approach 0, and an input of 0 lands exactly at 0.5."}, {"num": 219, "category": "Trainee Interview (Python, Math & ML)", "question": "scores.txt currently contains one line: Round 1: 10. What does the file contain after this runs?\n\nwith open(\"scores.txt\", \"a\") as f:\n    f.write(\"\\nRound 2: 20\")", "options": [{"label": "A", "text": "Only Round 2: 20"}, {"label": "B", "text": "The file is emptied"}, {"label": "C", "text": "Only Round 1: 10"}, {"label": "D", "text": "Both lines: Round 1: 10 and Round 2: 20"}], "correct": "D", "explanation": "Mode \"a\" stands for append. It moves to the end of the file and adds new text after whatever is already there, rather than erasing it the way \"w\" does."}, {"num": 220, "category": "Trainee Interview (Python, Math & ML)", "question": "What does this print?\n\nimport pandas as pd\n\ndf = pd.DataFrame({\n    \"name\": [\"Ravi\", \"Anu\", \"Ravi\", \"Kumar\"],\n    \"score\": [70, 88, 70, 95]\n})\nprint(len(df.drop_duplicates()))", "options": [{"label": "A", "text": "4"}, {"label": "B", "text": "1"}, {"label": "C", "text": "3"}, {"label": "D", "text": "2"}], "correct": "C", "explanation": "The Ravi/70 row appears twice and counts as one duplicate. drop_duplicates() keeps only the first occurrence, so four rows become three. Left in place, duplicates quietly bias a model toward whatever got repeated."}];

const state = {
  idx: 0,
  answers: {}, // qnum -> {selected, correct}
  filter: null,
  finished: false
};

// ---- persistence (per-viewer, local only) ----
function loadState() {
  try {
    const raw = localStorage.getItem('pyquiz_progress_v1');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.answers) state.answers = parsed.answers;
    }
  } catch (e) { /* ignore */ }
}
function saveState() {
  try {
    localStorage.setItem('pyquiz_progress_v1', JSON.stringify({ answers: state.answers }));
  } catch (e) { /* ignore */ }
}
loadState();

const categories = [...new Set(QUESTIONS.map(q => q.category))];

function visibleQuestions() {
  return state.filter ? QUESTIONS.filter(q => q.category === state.filter) : QUESTIONS;
}

function renderRailFilters() {
  const el = document.getElementById('railFilters');
  el.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (state.filter === null ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { state.filter = null; state.idx = 0; renderAll(); };
  el.appendChild(allChip);
  categories.forEach(cat => {
    const c = document.createElement('button');
    c.className = 'chip' + (state.filter === cat ? ' active' : '');
    c.textContent = cat;
    c.onclick = () => { state.filter = cat; state.idx = 0; renderAll(); };
    el.appendChild(c);
  });
}

function renderRailGrid() {
  const grid = document.getElementById('qgrid');
  grid.innerHTML = '';
  const vq = visibleQuestions();
  vq.forEach((q, i) => {
    const dot = document.createElement('div');
    const ans = state.answers[q.num];
    let cls = 'qdot';
    if (i === state.idx) cls += ' current';
    if (ans) cls += ans.correct ? ' correct' : ' incorrect';
    dot.className = cls;
    dot.textContent = q.num;
    dot.onclick = () => { state.idx = i; closeRail(); renderAll(); };
    grid.appendChild(dot);
  });
  const answeredCount = Object.keys(state.answers).length;
  document.getElementById('railScore').innerHTML = answeredCount + '<span> / ' + QUESTIONS.length + ' answered</span>';
}

function renderProgress() {
  const vq = visibleQuestions();
  const pct = vq.length ? Math.round(((state.idx) / vq.length) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = (state.idx + 1) + ' / ' + vq.length;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function looksLikeCode(text) {
  if (/\n[ \t]{2,}\S/.test(text)) return true; // an indented continuation line = code block
  if (/\b(def |import |from |class |print\(|with open|elif |except|while True|for \w+ in |return )/.test(text)) return true;
  if (text.split('\n').length >= 2 && /[=\[\]{}()]/.test(text) && !/[?.!]\s*$/.test(text.trim())) return true;
  return false;
}

function renderQuestionBlock(q) {
  const parts = q.question.split(/\n\n+/).map(s => s.trim()).filter(Boolean);
  if (parts.length === 0) return `<p class="question-text"><span class="qnum">Q${q.num}.</span></p>`;

  // group consecutive code paragraphs into a single block so multi-step
  // snippets (e.g. two writes separated by a blank line) render as one box
  const groups = [];
  parts.forEach(part => {
    const isCode = looksLikeCode(part);
    const last = groups[groups.length - 1];
    if (isCode && last && last.type === 'code') {
      last.text += '\n\n' + part;
    } else {
      groups.push({ type: isCode ? 'code' : 'prose', text: part });
    }
  });

  let html = '';
  let firstProseUsed = false;
  groups.forEach(g => {
    if (g.type === 'code') {
      html += `<pre class="qcode-block">${escapeHtml(g.text)}</pre>`;
    } else {
      const prefix = !firstProseUsed ? `<span class="qnum">Q${q.num}.</span> ` : '';
      firstProseUsed = true;
      html += `<p class="question-text">${prefix}${escapeHtml(g.text)}</p>`;
    }
  });
  // if question opened directly with code, still stamp the number somewhere
  if (!firstProseUsed) {
    html = `<p class="question-text"><span class="qnum">Q${q.num}.</span></p>` + html;
  }
  return html;
}

function renderCard() {
  const vq = visibleQuestions();
  const card = document.getElementById('quizCard');
  if (vq.length === 0) {
    card.innerHTML = '<p>No questions in this category.</p>';
    return;
  }
  if (state.idx >= vq.length) state.idx = vq.length - 1;
  const q = vq[state.idx];
  const existing = state.answers[q.num];

  if (state.lastQNum !== q.num) {
    state.highlightIdx = 0;
    state.lastQNum = q.num;
  }

  let optionsHtml = '';
  q.options.forEach((opt, i) => {
    let cls = 'opt';
    if (existing) {
      cls += ' locked';
      if (opt.label === q.correct) cls += ' correct';
      else if (opt.label === existing.selected) cls += ' incorrect';
      else cls += ' dim';
    } else {
      if (state.tempSelected === opt.label) cls += ' selected';
      if (state.keyboardNavActive && i === state.highlightIdx) cls += ' focused';
    }
    optionsHtml += `<button class="${cls}" data-label="${opt.label}" onclick="selectOption('${q.num}','${opt.label}')">
      <span class="opt-label">${opt.label}</span>
      <span>${escapeHtml(opt.text)}</span>
    </button>`;
  });

  const showExplain = !!existing;

  card.innerHTML = `
    <span class="cat-tag">${escapeHtml(q.category)}</span>
    ${renderQuestionBlock(q)}
    <div class="options">${optionsHtml}</div>
    <div class="explain ${showExplain ? 'show' : ''}" id="explainBox">
      ${showExplain ? '<b>Why: </b>' + escapeHtml(q.explanation) : ''}
    </div>
    <div class="actions">
      <button class="btn-ghost" onclick="prevQ()" ${state.idx === 0 ? 'disabled' : ''}>&larr; previous</button>
      <div style="display:flex; gap:10px; align-items:center;">
        ${existing ? '<button class="btn-ghost" onclick="resetQuestion(\'' + q.num + '\')">↺ retry this question</button>' : ''}
        ${!existing ? '<button class="btn primary" id="checkBtn" onclick="checkAnswer(\'' + q.num + '\')" disabled>Check answer</button>' : '<button class="btn primary" onclick="nextQ()">' + (state.idx === vq.length - 1 ? 'See summary' : 'Next question') + ' &rarr;</button>'}
      </div>
    </div>
    ${!existing ? '<p class="kbd-hint">use &uarr; &darr; to move, Enter to pick and confirm</p>' : ''}
  `;
}

function selectOption(qnum, label) {
  if (state.answers[qnum]) return;
  state.tempSelected = label;
  const q = QUESTIONS.find(x => x.num == qnum);
  if (q) {
    const idx = q.options.findIndex(o => o.label === label);
    if (idx !== -1) state.highlightIdx = idx;
  }
  renderCard();
  const btn = document.getElementById('checkBtn');
  if (btn) btn.disabled = false;
}

function checkAnswer(qnum) {
  const q = QUESTIONS.find(x => x.num == qnum);
  const sel = state.tempSelected;
  if (!sel) return;
  state.answers[qnum] = { selected: sel, correct: sel === q.correct };
  state.tempSelected = null;
  saveState();
  renderAll();
}

function nextQ() {
  const vq = visibleQuestions();
  if (state.idx < vq.length - 1) {
    state.idx++;
    renderAll();
  } else {
    renderSummary();
  }
}
function prevQ() {
  if (state.idx > 0) { state.idx--; renderAll(); }
}

function renderSummary() {
  const vq = visibleQuestions();
  const answered = vq.filter(q => state.answers[q.num]);
  const correct = answered.filter(q => state.answers[q.num].correct).length;
  const total = vq.length;

  const byCat = {};
  vq.forEach(q => {
    byCat[q.category] = byCat[q.category] || { correct: 0, total: 0 };
    byCat[q.category].total++;
    if (state.answers[q.num] && state.answers[q.num].correct) byCat[q.category].correct++;
  });

  let gridHtml = '';
  Object.entries(byCat).forEach(([cat, v]) => {
    gridHtml += `<div class="summary-cat"><div class="label">${escapeHtml(cat)}</div><div class="val">${v.correct} / ${v.total}</div></div>`;
  });

  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div class="summary">
      <p class="rail-title" style="text-align:center;">session complete</p>
      <p class="big">${correct}<span> / ${total}</span></p>
      <p>${answered.length < total ? (total - answered.length) + ' question(s) left unanswered in this set.' : 'Nice work — every question in this set is answered.'}</p>
      <div class="summary-grid">${gridHtml}</div>
      <div class="actions" style="justify-content:center; gap:12px;">
        <button class="btn" onclick="reviewMissed()">Review incorrect</button>
        <button class="btn primary" onclick="resetSet()">Retake this set</button>
      </div>
    </div>
  `;
  document.getElementById('progressLabel').textContent = total + ' / ' + total;
  document.getElementById('progressFill').style.width = '100%';
}

function reviewMissed() {
  const vq = visibleQuestions();
  const missedIdx = vq.findIndex(q => state.answers[q.num] && !state.answers[q.num].correct);
  if (missedIdx >= 0) { state.idx = missedIdx; renderAll(); }
}

function resetQuestion(qnum) {
  delete state.answers[qnum];
  state.tempSelected = null;
  saveState();
  renderAll();
}

function resetSet() {
  const vq = visibleQuestions();
  vq.forEach(q => delete state.answers[q.num]);
  state.idx = 0;
  saveState();
  renderAll();
}

function resetAll() {
  const answeredCount = Object.keys(state.answers).length;
  const btn = document.getElementById('resetAllBtn');
  if (answeredCount === 0) return;

  if (!state.confirmingReset) {
    state.confirmingReset = true;
    if (btn) {
      btn.textContent = 'click again to confirm — resets all ' + answeredCount;
      btn.classList.add('confirming');
    }
    clearTimeout(state.confirmingResetTimer);
    state.confirmingResetTimer = setTimeout(() => {
      state.confirmingReset = false;
      if (btn) {
        btn.textContent = '↺ reset all progress';
        btn.classList.remove('confirming');
      }
    }, 3000);
    return;
  }

  clearTimeout(state.confirmingResetTimer);
  state.confirmingReset = false;
  state.answers = {};
  state.idx = 0;
  state.tempSelected = null;
  saveState();
  renderAll();
  if (btn) {
    btn.textContent = '↺ reset all progress';
    btn.classList.remove('confirming');
  }
}

function renderAll() {
  renderRailFilters();
  renderRailGrid();
  renderProgress();
  renderCard();
}

function closeRail() {
  document.getElementById('rail').classList.remove('open');
}

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('rail').classList.toggle('open');
});
document.getElementById('railCloseBtn').addEventListener('click', closeRail);

document.addEventListener('keydown', function(e) {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Enter') return;

  const rail = document.getElementById('rail');
  if (rail.classList.contains('open')) return;

  const card = document.getElementById('quizCard');
  if (!card || card.querySelector('.summary')) return;

  const vq = visibleQuestions();
  if (!vq.length || state.idx >= vq.length) return;

  const q = vq[state.idx];
  const existing = state.answers[q.num];

  if (e.key === 'ArrowDown') {
    if (existing) return;
    e.preventDefault();
    state.keyboardNavActive = true;
    state.highlightIdx = ((state.highlightIdx || 0) + 1) % q.options.length;
    renderCard();
  } else if (e.key === 'ArrowUp') {
    if (existing) return;
    e.preventDefault();
    state.keyboardNavActive = true;
    state.highlightIdx = ((state.highlightIdx || 0) - 1 + q.options.length) % q.options.length;
    renderCard();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!existing) {
      const hIdx = state.highlightIdx || 0;
      const label = q.options[hIdx].label;
      if (state.tempSelected === label) {
        checkAnswer(q.num);
      } else {
        state.keyboardNavActive = true;
        selectOption(q.num, label);
      }
    } else {
      nextQ();
    }
  }
});

renderAll();
</script>
</body>
</html>
